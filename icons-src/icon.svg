<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050d18"/>
    </radialGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Estrelas ao fundo -->
  <circle cx="80" cy="90" r="2.5" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="430" cy="120" r="2" fill="#7dd3fc" opacity="0.4"/>
  <circle cx="60" cy="400" r="2" fill="#7dd3fc" opacity="0.35"/>
  <circle cx="450" cy="380" r="3" fill="#7dd3fc" opacity="0.45"/>
  <circle cx="150" cy="60" r="1.5" fill="#bae6fd" opacity="0.5"/>
  <circle cx="380" cy="70" r="1.8" fill="#bae6fd" opacity="0.4"/>

  <!-- Sombra do avião -->
  <ellipse cx="256" cy="390" rx="160" ry="18" fill="#000" opacity="0.35"/>

  <!-- Avião estilizado — visto de cima, levemente inclinado -->
  <g transform="translate(256 256) rotate(-15) translate(-256 -256)" filter="url(#glow)">

    <!-- Fuselagem principal -->
    <path d="M 256 90
             C 275 90, 285 130, 285 200
             L 285 360
             C 285 385, 275 400, 256 400
             C 237 400, 227 385, 227 360
             L 227 200
             C 227 130, 237 90, 256 90 Z"
          fill="url(#planeGrad)"/>

    <!-- Linha central da fuselagem (detalhe) -->
    <path d="M 256 100 L 256 390"
          stroke="#ffffff" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

    <!-- Asa esquerda -->
    <path d="M 227 240
             L 90 300
             L 90 340
             L 227 305 Z"
          fill="url(#wingGrad)"/>

    <!-- Asa direita -->
    <path d="M 285 240
             L 422 300
             L 422 340
             L 285 305 Z"
          fill="url(#wingGrad)"/>

    <!-- Asa traseira esquerda -->
    <path d="M 234 355 L 165 380 L 165 395 L 234 380 Z"
          fill="#0284c7" opacity="0.9"/>

    <!-- Asa traseira direita -->
    <path d="M 278 355 L 347 380 L 347 395 L 278 380 Z"
          fill="#0284c7" opacity="0.9"/>

    <!-- Cockpit (bolha azul clara) -->
    <ellipse cx="256" cy="160" rx="20" ry="35" fill="#bae6fd" opacity="0.9"/>
    <ellipse cx="256" cy="160" rx="12" ry="22" fill="#0ea5e9" opacity="0.7"/>

    <!-- Ponta iluminada -->
    <circle cx="256" cy="100" r="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Anel de destaque -->
  <circle cx="256" cy="256" r="228"
          fill="none" stroke="#7dd3fc" stroke-width="4" opacity="0.25"/>
</svg>
