<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airplane Builder">
<meta name="theme-color" content="#0a1628">
<title>Airplane Builder 3D — Aprender Voando</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-1:#0a1628; --bg-2:#1e3a5f; --bg-3:#050d18;
  --text:#f0f9ff; --text-muted:#94a3b8;
  --surface:rgba(255,255,255,.06);
  --surface-hover:rgba(255,255,255,.12);
  --border:rgba(125,211,252,.2);
  --accent-1:#0ea5e9; --accent-2:#3b82f6; --accent-3:#7dd3fc;
  --success:#4ade80; --warning:#fbbf24; --danger:#ef4444;
  --sci:#22d3ee; --mat:#fbbf24; --por:#f472b6; --eng:#a78bfa;
  --btn-bg:linear-gradient(135deg,#0ea5e9,#3b82f6);
  --shadow-sm:0 4px 12px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --glow-cyan:0 0 24px rgba(125,211,252,.5);
  --t-base:.25s cubic-bezier(.16,1,.3,1);
  --t-slow:.4s cubic-bezier(.16,1,.3,1);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --radius-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  height:100%; margin:0;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body{
  background:radial-gradient(circle at 50% 30%,var(--bg-2) 0%,var(--bg-1) 55%,var(--bg-3) 100%);
  display:flex; flex-direction:column; min-height:100dvh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

#canvas-container{position:fixed; inset:0; touch-action:none; z-index:1}
#canvas-container canvas{display:block; outline:none}

/* ===== HUD TOP ===== */
.hud-top{
  position:fixed; top:0; left:0; right:0;
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:12px;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  z-index:10;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
  pointer-events:none;
}
.hud-top > *{pointer-events:auto}
.hud-actions{display:flex; gap:8px; align-items:center}
.btn-icon{
  width:40px; height:40px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:17px;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--t-base);
  backdrop-filter:blur(10px);
  color:var(--text);
}
.btn-icon:hover{background:var(--surface-hover); transform:translateY(-2px)}
.btn-icon[hidden]{display:none}
.btn-icon.active{
  background:rgba(34,211,238,.2);
  border-color:rgba(34,211,238,.6);
  box-shadow:0 0 16px rgba(34,211,238,.4);
}
.btn-install{
  animation:installPulse 2.4s ease-in-out infinite;
  background:rgba(74,222,128,.12);
  border-color:rgba(74,222,128,.4);
}
@keyframes installPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}
  50%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
}

.hud-title{
  text-align:center;
  font-weight:800; font-size:14px;
  letter-spacing:1px;
  color:var(--accent-3);
  text-shadow:0 0 12px rgba(125,211,252,.5);
}
.hud-stats{
  display:flex; gap:14px; font-size:11px;
  justify-content:center;
  font-variant-numeric:tabular-nums;
}
.hud-stats span{opacity:.7; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
.hud-stats b{color:var(--accent-3); font-weight:800; font-size:13px}

/* ===== HINT TAG ===== */
.hint-tag{
  position:fixed;
  top:calc(70px + var(--safe-top));
  left:50%; transform:translateX(-50%);
  padding:10px 18px;
  border-radius:var(--radius-full);
  background:rgba(251,191,36,.25);
  border:2px solid rgba(251,191,36,.7);
  color:#fde68a;
  font-size:13px; font-weight:800;
  z-index:9;
  backdrop-filter:blur(10px);
  pointer-events:none;
  text-align:center;
  max-width:92vw;
  box-shadow:0 0 30px rgba(251,191,36,.3);
  animation:fadeIn .5s ease;
}
.hint-tag.warn{
  background:rgba(251,191,36,.4);
  border-color:#fbbf24;
  color:#fffbeb;
  animation:pulseTag 1s ease-in-out infinite;
}
@keyframes pulseTag{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.05)}
}
@keyframes fadeIn{
  from{opacity:0; transform:translate(-50%,-10px)}
  to{opacity:1; transform:translate(-50%,0)}
}

/* ===== TOASTS ===== */
.toast-container{
  position:fixed;
  top:calc(120px + var(--safe-top));
  left:50%; transform:translateX(-50%);
  z-index:2000;
  display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:none;
  max-width:90vw;
}
.toast{
  color:#fff; padding:10px 18px;
  border-radius:var(--radius-full);
  font-weight:700; font-size:12px;
  box-shadow:var(--shadow-md);
  animation:toastIn .3s ease;
  max-width:90vw; text-align:center;
  backdrop-filter:blur(10px);
}
.toast.info{background:linear-gradient(135deg,var(--accent-1),var(--accent-2))}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.toast.success{background:linear-gradient(135deg,var(--success),#15803d)}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}

/* ===== HUD BOTTOM ===== */
.hud-bottom{
  position:fixed;
  bottom:0; left:0; right:0;
  display:flex; justify-content:center; gap:8px;
  padding:14px 14px calc(14px + var(--safe-bottom));
  z-index:10;
  background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
  flex-wrap:wrap;
}
.btn{
  padding:11px 18px;
  border-radius:var(--radius-full);
  border:1px solid rgba(125,211,252,.3);
  background:var(--btn-bg);
  color:#fff;
  font-size:13px; font-weight:700;
  cursor:pointer;
  transition:all var(--t-base);
  display:inline-flex; align-items:center; gap:6px;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 6px 20px rgba(14,165,233,.5)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.secondary{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.15);
  box-shadow:none;
}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* ===== MENU ===== */
.main-menu{
  position:fixed; inset:0;
  z-index:50;
  display:flex; flex-direction:column;
  padding:calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
  background:radial-gradient(circle at 50% 30%,var(--bg-2) 0%,var(--bg-1) 55%,var(--bg-3) 100%);
  overflow-y:auto;
  transition:opacity var(--t-slow), transform var(--t-slow);
}
.main-menu.hidden{opacity:0; transform:translateY(-20px); pointer-events:none}
.menu-header{text-align:center; margin-bottom:24px}
.menu-header h1{
  font-size:30px; margin:0 0 6px;
  font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent-3),var(--accent-1));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.menu-header p{color:var(--text-muted); font-size:13px; margin:0}
.plane-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:14px;
  max-width:640px; margin:0 auto; width:100%;
}
.plane-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px 14px;
  text-align:center;
  cursor:pointer;
  transition:all var(--t-base);
  position:relative;
  overflow:hidden;
}
.plane-card:hover:not(.locked){
  background:var(--surface-hover);
  transform:translateY(-3px);
  border-color:var(--accent-3);
  box-shadow:var(--glow-cyan);
}
.plane-card.locked{opacity:.45; cursor:not-allowed}
.plane-card.locked::after{content:'🔒'; position:absolute; top:8px; right:8px; font-size:18px}
.plane-card.completed::before{
  content:'✓';
  position:absolute; top:8px; left:8px;
  width:22px; height:22px;
  border-radius:50%;
  background:var(--success);
  color:#fff; font-size:13px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.plane-emoji{font-size:46px; margin-bottom:6px; display:block}
.plane-name{font-size:13px; font-weight:700; margin-bottom:4px}
.plane-parts{font-size:10px; text-transform:uppercase; color:var(--text-muted); letter-spacing:1px}

/* ===== CARD PEDAGÓGICO ===== */
.ped-card-overlay{
  position:fixed; inset:0;
  z-index:150;
  display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  padding:20px;
  animation:fadeInCard .3s ease;
}
.ped-card-overlay.active{display:flex}
@keyframes fadeInCard{from{opacity:0}to{opacity:1}}

.ped-card{
  background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
  border:2px solid var(--accent-3);
  border-radius:var(--radius-xl);
  max-width:480px; width:100%;
  max-height:88vh;
  display:flex; flex-direction:column;
  box-shadow:var(--shadow-lg), 0 0 60px rgba(125,211,252,.3);
  animation:popCard .4s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
@keyframes popCard{from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1}}

.ped-header{
  padding:16px 20px 12px;
  display:flex; align-items:center; gap:14px;
  border-bottom:1px solid var(--border);
}
.ped-emoji{
  font-size:44px;
  filter:drop-shadow(0 0 12px rgba(125,211,252,.6));
}
.ped-names{flex:1}
.ped-name-pt{
  font-family:'Fredoka',sans-serif;
  font-size:24px; font-weight:700;
  color:#fff; margin:0;
  line-height:1.1;
}
.ped-name-en{
  font-size:14px; color:var(--accent-3);
  font-weight:600;
  margin-top:2px;
}
.ped-name-en .pron{
  font-size:11px;
  color:var(--text-muted);
  font-weight:400;
  margin-left:6px;
}
.ped-close{
  width:32px; height:32px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  font-size:16px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:all var(--t-base);
}
.ped-close:hover{background:rgba(255,255,255,.15); transform:rotate(90deg)}

.ped-tabs{
  display:flex;
  padding:0 12px;
  gap:4px;
  background:rgba(0,0,0,.2);
}
.ped-tab{
  flex:1;
  padding:10px 6px 12px;
  background:none;
  border:none;
  color:var(--text-muted);
  font-size:11px; font-weight:700;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all var(--t-base);
  display:flex; flex-direction:column; align-items:center; gap:2px;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.ped-tab .tab-icon{font-size:18px}
.ped-tab:hover{color:var(--text)}
.ped-tab.active{color:#fff; border-bottom-color:currentColor}
.ped-tab[data-tab="sci"].active{color:var(--sci); border-bottom-color:var(--sci)}
.ped-tab[data-tab="mat"].active{color:var(--mat); border-bottom-color:var(--mat)}
.ped-tab[data-tab="por"].active{color:var(--por); border-bottom-color:var(--por)}
.ped-tab[data-tab="eng"].active{color:var(--eng); border-bottom-color:var(--eng)}

.ped-body{
  padding:20px;
  overflow-y:auto;
  flex:1;
  -webkit-overflow-scrolling:touch;
}
.ped-body::-webkit-scrollbar{width:6px}
.ped-body::-webkit-scrollbar-thumb{background:rgba(125,211,252,.3); border-radius:3px}

.ped-pane{display:none}
.ped-pane.active{display:block; animation:fadeSlide .3s ease}
@keyframes fadeSlide{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:translateY(0)}}

.ped-pane-title{
  font-family:'Fredoka',sans-serif;
  font-size:17px; font-weight:600;
  margin:0 0 12px;
}
.ped-pane[data-pane="sci"] .ped-pane-title{color:var(--sci)}
.ped-pane[data-pane="mat"] .ped-pane-title{color:var(--mat)}
.ped-pane[data-pane="por"] .ped-pane-title{color:var(--por)}
.ped-pane[data-pane="eng"] .ped-pane-title{color:var(--eng)}

.ped-text{
  font-size:14px; line-height:1.6;
  color:#e2e8f0;
  margin:0 0 12px;
}
.ped-fact{
  background:rgba(34,211,238,.1);
  border-left:3px solid var(--sci);
  padding:10px 14px;
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  font-size:13px; line-height:1.5;
  margin:12px 0 0;
}
.ped-fact strong{color:var(--sci)}

/* Sílabas coloridas */
.syllable{
  display:inline-block;
  padding:2px 6px;
  margin:1px;
  border-radius:6px;
  font-weight:800;
  font-family:'Fredoka',sans-serif;
  font-size:20px;
}
.syllable.vowel{background:rgba(244,114,182,.25); color:#fbcfe8}
.syllable.cons{background:rgba(59,130,246,.25); color:#bfdbfe}

.ped-fam-list{
  list-style:none; padding:0; margin:12px 0;
  display:flex; flex-wrap:wrap; gap:6px;
}
.ped-fam-list li{
  padding:4px 10px;
  background:rgba(244,114,182,.15);
  border-radius:var(--radius-full);
  font-size:12px;
  color:#fbcfe8;
  font-weight:600;
}

.ped-example{
  background:rgba(167,139,250,.1);
  border-left:3px solid var(--eng);
  padding:10px 14px;
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  font-size:14px;
  margin:12px 0;
}
.ped-example .en{font-style:italic; color:#ddd6fe; font-weight:600}
.ped-example .pt{color:var(--text-muted); font-size:12px; margin-top:4px; display:block}

.ped-actions{
  padding:12px 20px calc(12px + var(--safe-bottom));
  border-top:1px solid var(--border);
  display:flex; gap:8px;
}
.ped-btn{
  flex:1;
  padding:12px;
  border-radius:var(--radius-md);
  border:none;
  font-size:13px; font-weight:700;
  cursor:pointer;
  transition:all var(--t-base);
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.ped-btn-listen{
  background:rgba(34,211,238,.15);
  border:1px solid rgba(34,211,238,.4);
  color:var(--sci);
}
.ped-btn-listen:hover{background:rgba(34,211,238,.25)}
.ped-btn-next{
  background:var(--btn-bg);
  color:#fff;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
}
.ped-btn-next:hover{transform:translateY(-2px)}

/* ===== MODAL DE VITÓRIA (com quiz) ===== */
.win-modal{
  position:fixed; inset:0;
  display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  z-index:100;
  padding:20px;
  overflow-y:auto;
}
.win-modal.active{display:flex}
.win-card{
  background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
  border:1px solid rgba(125,211,252,.4);
  border-radius:var(--radius-xl);
  padding:28px 22px;
  text-align:center;
  max-width:420px; width:100%;
  box-shadow:var(--shadow-lg);
  animation:popCard .4s cubic-bezier(.34,1.56,.64,1);
}
.win-emoji{font-size:56px; margin-bottom:8px; animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
.win-card h2{font-size:24px; color:var(--accent-3); margin:0 0 8px; font-weight:800}
.win-card p{opacity:.8; font-size:13px; margin:0 0 16px; color:var(--text-muted)}

.win-stats{
  display:flex; justify-content:space-around;
  padding:14px; background:rgba(125,211,252,.08);
  border-radius:var(--radius-md); margin-bottom:16px;
}
.win-stat-value{font-size:22px; font-weight:800; color:var(--accent-3)}
.win-stat-label{font-size:9px; text-transform:uppercase; color:var(--text-muted); letter-spacing:1px}

/* Quiz */
.quiz-section{
  text-align:left;
  padding:16px;
  background:rgba(167,139,250,.08);
  border-radius:var(--radius-md);
  margin-bottom:16px;
}
.quiz-title{
  font-family:'Fredoka',sans-serif;
  font-size:14px; font-weight:600;
  color:var(--eng);
  margin:0 0 10px;
  display:flex; align-items:center; gap:6px;
}
.quiz-question{
  font-size:14px; font-weight:600;
  margin:0 0 12px;
  color:#fff;
}
.quiz-options{
  display:flex; flex-direction:column; gap:8px;
}
.quiz-option{
  padding:10px 14px;
  background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.15);
  border-radius:var(--radius-md);
  color:#fff;
  font-size:13px;
  text-align:left;
  cursor:pointer;
  transition:all var(--t-base);
}
.quiz-option:hover{background:rgba(255,255,255,.12); border-color:var(--accent-3)}
.quiz-option.correct{background:rgba(74,222,128,.2); border-color:var(--success); animation:pulseCorrect .4s}
.quiz-option.wrong{background:rgba(239,68,68,.2); border-color:var(--danger); animation:shakeQuiz .4s}
@keyframes pulseCorrect{0%,100%{transform:scale(1)} 50%{transform:scale(1.03)}}
@keyframes shakeQuiz{0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}

/* ===== LOADING ===== */
.loading{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px;
  background:var(--bg-1);
  z-index:300;
  font-size:13px; color:var(--accent-3);
  transition:opacity var(--t-slow);
}
.loading.hidden{opacity:0; pointer-events:none}
.loading-spinner{
  width:44px; height:44px;
  border:4px solid rgba(125,211,252,.2);
  border-top-color:var(--accent-3);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== CONFETTI ===== */
.confetti-container{
  position:fixed; inset:0;
  pointer-events:none;
  z-index:99;
  overflow:hidden;
}
.confetti-piece{
  position:absolute;
  width:10px; height:14px;
  top:-20px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{transform:translateY(110vh) rotate(720deg); opacity:0.3}
}

/* Responsivo */
@media (max-width:480px){
  .ped-name-pt{font-size:20px}
  .ped-tab{font-size:9px; padding:8px 4px 10px}
  .ped-tab .tab-icon{font-size:16px}
  .ped-body{padding:16px}
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- MENU -->
<div class="main-menu" id="main-menu">
  <div class="menu-header">
    <h1>✈️ APRENDER VOANDO</h1>
    <p>Monte aviões e descubra a ciência do voo</p>
  </div>
  <div class="plane-grid" id="plane-grid"></div>
</div>

<!-- HUD TOP -->
<div class="hud-top" id="hud-top" style="display:none">
  <div class="hud-actions">
    <button class="btn-icon" id="btn-back" type="button" aria-label="Voltar">←</button>
    <button class="btn-icon active" id="btn-ped" type="button" title="Modo aprendizado">🎓</button>
    <button class="btn-icon btn-install" id="btn-install" type="button" hidden>⬇️</button>
  </div>
  <div>
    <div class="hud-title" id="hud-title">MONTAGEM</div>

const Storage = {
  get(k, fb=null){ try{ const r=localStorage.getItem(k); return r===null?fb:r; }catch{ return fb; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch{} },
  getJSON(k, fb){ try{ const r=localStorage.getItem(k); return r===null?fb:JSON.parse(r); }catch{ return fb; } },
  setJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

const Toaster = (() => {
  const c = document.getElementById('toast-container');
  const q = []; let active = false;
  const show = ({msg, type}) => {
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.textContent = msg;
    c.appendChild(el);
    let done = false;
    const finish = () => { if(done)return; done=true; el.remove(); active=false; next(); };
    setTimeout(finish, CONFIG.TOAST_DURATION);
    setTimeout(finish, 5000);
  };
  const next = () => { if(active||!q.length)return; active=true; show(q.shift()); };
  const push = (msg,type) => { q.push({msg,type}); next(); };
  return { info: m=>push(m,'info'), warn: m=>push(m,'warn'), success: m=>push(m,'success') };
})();

const Sound = (() => {
  let ctx = null;
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.SOUND, '1') === '1';
  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  };
  const tone = (freq, type, dur, vol) => {
    if (!enabled) return;
    const ac = ensure(); if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator(); const g = ac.createGain();
    osc.frequency.value = freq; osc.type = type;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(now); osc.stop(now + dur);
  };
  return {
    isEnabled: () => enabled,
    toggle() { enabled = !enabled; Storage.set(CONFIG.STORAGE_KEYS.SOUND, enabled?'1':'0'); if(enabled) tone(880,'sine',.1,.1); return enabled; },
    pickup: () => { tone(500, 'sine', .06, .04); tone(750, 'sine', .08, .04); },
    snap:   () => { tone(720, 'triangle', .1, .08); tone(1080, 'sine', .15, .06); },
    wrong:  () => tone(220, 'sine', .12, .05),
    correct:() => { tone(880, 'sine', .1, .08); tone(1320, 'sine', .15, .06); },
    win()   {
      if (!enabled) return;
      const ac = ensure(); if (!ac) return;
      const now = ac.currentTime;
      [523, 659, 784, 1046, 1318].forEach((f,i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.frequency.value = f; o.type = 'sine';
        const t = now + i * .09;
        g.gain.setValueAtTime(.001, t);
        g.gain.exponentialRampToValueAtTime(.12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + .4);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + .4);
      });
    }
  };
})();

const Voice = (() => {
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.VOICE, '1') === '1';
  let voicePt = null, voiceEn = null, ready = false;

  const loadVoices = () => {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    voicePt = voices.find(v => v.lang.startsWith('pt-BR')) || voices.find(v => v.lang.startsWith('pt'));
    voiceEn = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
    ready = true;
  };

  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  return {
    isEnabled: () => enabled && ready,
    toggle() {
      enabled = !enabled;
      Storage.set(CONFIG.STORAGE_KEYS.VOICE, enabled ? '1' : '0');
      return enabled;
    },
    speak(text, lang = 'pt-BR') {
      if (!enabled || !ready || !('speechSynthesis' in window)) return;
      try {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.voice = lang === 'pt-BR' ? voicePt : voiceEn;
        utter.rate = 0.95;
        utter.pitch = 1.1;
        utter.volume = 0.9;
        speechSynthesis.speak(utter);
      } catch {}
    },
    stop() {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
    }
  };
})();

/* ============================================================
   GEOMETRIA
   ============================================================ */
const buildGeometry = (geoDef) => {
  const [type, params] = geoDef;
  switch (type) {
    case 'box':      return new THREE.BoxGeometry(...params);
    case 'cylinder': return new THREE.CylinderGeometry(...params);
    case 'cone':     return new THREE.ConeGeometry(...params);
    case 'sphere':   return new THREE.SphereGeometry(...params);
    default:         return new THREE.BoxGeometry(1,1,1);
  }
};

/* ============================================================
   CARREGAR AVIÃO
   ============================================================ */
const clearScene = () => {
  for (const m of state.meshes.values()) scene.remove(m);
  for (const s of state.slots.values()) scene.remove(s);
  state.meshes.clear();
  state.slots.clear();
  state.draggable.length = 0;
  state.placedParts.clear();
};

const loadPlane = (planeId) => {
  const plane = AIRPLANES.find(p => p.id === planeId);
  if (!plane) return;

  clearScene();
  state.currentPlane = plane;
  state.placedParts.clear();
  state.moves = 0;
  state.startTime = Date.now();
  state.totalParts = plane.parts.length;

  /* Ghost slots */
  plane.parts.forEach(part => {
    const geo = buildGeometry(part.geo);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xfbbf24, transparent: true, opacity: 0.35, wireframe: true
    });
    const ghost = new THREE.Mesh(geo, mat);
    ghost.position.set(...part.slot.pos);
    ghost.rotation.set(...part.slot.rot);
    ghost.userData.isGhost = true;
    scene.add(ghost);
    state.slots.set(part.id, ghost);
  });

  /* Peças */
  plane.parts.forEach((part, i) => {
    const geo = buildGeometry(part.geo);
    const mat = new THREE.MeshStandardMaterial({
      color: part.color,
      metalness: 0.15,
      roughness: 0.4,
      emissive: part.color,
      emissiveIntensity: 0.15
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.partId = part.id;

    const angle = (i / plane.parts.length) * Math.PI - Math.PI/2;
    const radius = 6;
    mesh.position.set(
      Math.cos(angle) * radius * 1.3,
      -0.3,
      Math.sin(angle) * radius * 0.7 + 5
    );
    mesh.rotation.set(
      Math.random()*0.4 - 0.2,
      Math.random()*Math.PI*2,
      Math.random()*0.4 - 0.2
    );
    mesh.userData.originPosition = mesh.position.clone();

    scene.add(mesh);
    state.meshes.set(part.id, mesh);
    state.draggable.push(mesh);
  });

  const dist = 7.5 + plane.parts.length * 0.15;
  camera.position.set(dist * 0.7, dist * 0.55, dist);
  controls.target.set(0, 0.6, 0);

  updateHUD();
  Voice.speak(`Vamos montar o ${plane.name}!`);
};

/* ============================================================
   DRAG & DROP
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const dragOffset = new THREE.Vector3();
const intersectPoint = new THREE.Vector3();
let draggingObject = null;
let hoveredObject = null;

const updatePointer = (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
};

const onPointerDown = (e) => {
  if (e.target !== renderer.domElement) return;
  if (document.getElementById('main-menu').offsetParent !== null) return;
  if (document.getElementById('ped-overlay').classList.contains('active')) return;

  resetIdleTimer();
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(state.draggable, false);
  if (!hits.length) return;

  draggingObject = hits[0].object;
  if (state.placedParts.has(draggingObject.userData.partId)) {
    draggingObject = null;
    return;
  }

  controls.enabled = false;
  Sound.pickup();

  const partId = draggingObject.userData.partId;
  const lesson = PART_LESSONS[partId];
  if (lesson) {
    Voice.speak(`Pegou a ${lesson.name}.`);
  }

  dragPlane.setFromNormalAndCoplanarPoint(
    new THREE.Vector3(0,1,0), draggingObject.position
  );
  raycaster.ray.intersectPlane(dragPlane, intersectPoint);
  dragOffset.copy(draggingObject.position).sub(intersectPoint);

  draggingObject.userData._scale = 1;
  const scaleUp = () => {
    if (!draggingObject) return;
    draggingObject.userData._scale = Math.min(CONFIG.PICKUP_SCALE, draggingObject.userData._scale + 0.05);
    draggingObject.scale.setScalar(draggingObject.userData._scale);
    if (draggingObject.userData._scale < CONFIG.PICKUP_SCALE) requestAnimationFrame(scaleUp);
  };
  scaleUp();
};

const onPointerMove = (e) => {
  if (!draggingObject) return;
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
    draggingObject.position.copy(intersectPoint.add(dragOffset));
  }
};

const onPointerUp = () => {
  if (!draggingObject) return;

  draggingObject.userData._scale = CONFIG.PICKUP_SCALE;
  const scaleDown = () => {
    if (!draggingObject) return;
    draggingObject.userData._scale = Math.max(1, draggingObject.userData._scale - 0.05);
    draggingObject.scale.setScalar(draggingObject.userData._scale);
    if (draggingObject.userData._scale > 1) requestAnimationFrame(scaleDown);
    else draggingObject.scale.setScalar(1);
  };
  scaleDown();

  const partId = draggingObject.userData.partId;
  const slot = state.slots.get(partId);
  const plane = state.currentPlane;
  const part = plane.parts.find(p => p.id === partId);

  const dist = draggingObject.position.distanceTo(slot.position);

  if (dist < CONFIG.SNAP_DISTANCE) {
    snapToSlot(draggingObject, part, slot);
  } else {
    Sound.wrong();
    returnToOrigin(draggingObject);
  }

  draggingObject = null;
  controls.enabled = true;
  resetIdleTimer();
};

const snapToSlot = (mesh, part, slot) => {
  const startPos = mesh.position.clone();
  const startRot = mesh.rotation.clone();
  const targetPos = slot.position.clone();
  const targetRot = new THREE.Euler(...part.slot.rot);

  const t0 = performance.now();
  const animate = () => {
    const t = Math.min((performance.now() - t0) / CONFIG.SNAP_ANIM_MS, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    mesh.position.lerpVectors(startPos, targetPos, ease);
    mesh.rotation.x = startRot.x + (targetRot.x - startRot.x) * ease;
    mesh.rotation.y = startRot.y + (targetRot.y - startRot.y) * ease;
    mesh.rotation.z = startRot.z + (targetRot.z - startRot.z) * ease;
    if (t < 1) requestAnimationFrame(animate);
    else onSnapped(mesh, slot, part);
  };
  animate();
};

const onSnapped = (mesh, slot, part) => {
  slot.visible = false;
  mesh.material.emissive = new THREE.Color(0x4ade80);
  mesh.material.emissiveIntensity = 0.7;
  setTimeout(() => {
    mesh.material.emissive = new THREE.Color(part.color);
    mesh.material.emissiveIntensity = 0.15;
  }, 500);

  state.placedParts.add(mesh.userData.partId);
  state.moves++;
  Sound.snap();

  /* Registra palavra aprendida */
  const wordId = mesh.userData.partId;
  if (!state.learnedWords.includes(wordId)) {
    state.learnedWords.push(wordId);
    Storage.setJSON(CONFIG.STORAGE_KEYS.LEARNED, state.learnedWords);
  }

  updateHUD();

  /* Abre o card pedagógico (se ativo) */
  if (state.pedagogicMode && PART_LESSONS[wordId]) {
    setTimeout(() => openPedCard(wordId), 400);
  } else {
    Voice.speak(`Boa! ${part.name} encaixada.`);
    if (state.placedParts.size === state.totalParts) setTimeout(onWin, 600);
  }
};

const returnToOrigin = (mesh) => {
  const origin = mesh.userData.originPosition.clone();
  const startPos = mesh.position.clone();
  const t0 = performance.now();
  const shakeAxis = Math.random() > 0.5 ? 1 : -1;

  const animate = () => {
    const t = Math.min((performance.now() - t0) / CONFIG.RETURN_ANIM_MS, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    mesh.position.lerpVectors(startPos, origin, ease);
    if (t < 0.4) {
      mesh.position.x += Math.sin(t * 30) * 0.15 * shakeAxis * (1 - t);
    }
    if (t < 1) requestAnimationFrame(animate);
  };
  animate();
};

/* ============================================================

   ============================================================ */
let hintTimeout = null;

const resetIdleTimer = () => {
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(showAutoHint, CONFIG.HINT_TIMEOUT_MS);
};

const showAutoHint = () => {
  if (!state.currentPlane) return;
  if (state.placedParts.size >= state.totalParts) return;

  const remaining = state.currentPlane.parts.filter(p => !state.placedParts.has(p.id));
  if (remaining.length === 0) return;

  const pick = remaining[0];
  const mesh = state.meshes.get(pick.id);
  const slot = state.slots.get(pick.id);
  if (!mesh || !slot) return;

  mesh.material.emissive = new THREE.Color(0xffffff);
  const t0 = performance.now();
  const pulse = () => {
    const t = (performance.now() - t0) / 1000;
    if (t > 2.5) {
      mesh.material.emissive = new THREE.Color(pick.color);
      mesh.material.emissiveIntensity = 0.15;
      return;
    }
    mesh.material.emissiveIntensity = 0.3 + Math.sin(t * 12) * 0.25;
    requestAnimationFrame(pulse);
  };
  pulse();

  const startScale = slot.scale.x;
  const start = performance.now();
  const anim = () => {
    const t = (performance.now() - start) / 250;
    if (t < 1) {
      slot.scale.setScalar(startScale * (1 + Math.sin(t * Math.PI) * 0.5));
      requestAnimationFrame(anim);
    } else {
      slot.scale.setScalar(startScale);
    }
  };
  anim();

  const lesson = PART_LESSONS[pick.id];
  if (lesson) {
    Toaster.info(`💡 Tente: ${lesson.name}`);
    Voice.speak(`Agora encaixe a ${lesson.name}`);
  }
};

['pointerdown','pointermove','touchstart','keydown'].forEach(evt => {

});

/* ============================================================
   LOOP
   ============================================================ */
const clock = new THREE.Clock();
const animate = () => {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  for (const [id, mesh] of state.meshes) {
    if (state.placedParts.has(id) || mesh === draggingObject) continue;
    const baseY = mesh.userData.originPosition?.y ?? -0.3;
    mesh.position.y = baseY + Math.sin(time * 1.5 + mesh.position.x) * 0.06;
    mesh.rotation.y += 0.004;
  }

  const propeller = state.meshes.get('propeller');
  if (propeller && state.placedParts.has('propeller')) {
    propeller.rotation.x += 0.18;
  }

  for (const ghost of state.slots.values()) {
    if (ghost.visible) {
      const pulse = 0.7 + Math.sin(time * 2.5) * 0.3;
      ghost.material.opacity = 0.25 + pulse * 0.25;
      ghost.scale.setScalar(0.98 + pulse * 0.05);
    }
  }

  controls.update();
  renderer.render(scene, camera);
};
animate();

/* ============================================================
   PWA
   ============================================================ */
const PWA = (() => {
  let deferredPrompt = null;
  const btnInstall = $('btn-install');

  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const init = () => {
    if (isStandalone() && btnInstall) btnInstall.hidden = true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (btnInstall && !isStandalone()) btnInstall.hidden = false;
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      if (btnInstall) btnInstall.hidden = true;
      Toaster.success('✅ App instalado!');
    });

    btnInstall?.addEventListener('click', async () => {
      if (!deferredPrompt) {
        Toaster.info('Use o menu do navegador para instalar');
        return;
      }
      try {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') Toaster.success('🎉 Instalando...');
        deferredPrompt = null;
        btnInstall.hidden = true;
      } catch (err) { console.warn('[PWA]', err); }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('[SW]', err));
      });
    }
  };

  return { init };
})();
