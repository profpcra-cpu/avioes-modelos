<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airplane Builder">
<meta name="theme-color" content="#0a1628">
<title>Airplane Builder 3D</title>

<!-- ===== PWA ===== -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-1:#0a1628; --bg-2:#1e3a5f; --bg-3:#050d18;
  --text:#f0f9ff; --text-muted:#94a3b8; --text-dim:#475569;
  --surface:rgba(255,255,255,.06);
  --surface-hover:rgba(255,255,255,.12);
  --border:rgba(125,211,252,.2);
  --accent-1:#0ea5e9; --accent-2:#3b82f6; --accent-3:#7dd3fc;
  --success:#4ade80; --warning:#fbbf24; --danger:#ef4444;
  --btn-bg:linear-gradient(135deg,#0ea5e9,#3b82f6);
  --shadow-sm:0 4px 12px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --glow-cyan:0 0 24px rgba(125,211,252,.5);
  --glow-gold:0 0 30px rgba(251,191,36,.6);
  --t-fast:.15s cubic-bezier(.16,1,.3,1);
  --t-base:.25s cubic-bezier(.16,1,.3,1);
  --t-slow:.4s cubic-bezier(.16,1,.3,1);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --radius-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  height:100%; margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body{
  background:radial-gradient(circle at 50% 30%,var(--bg-2) 0%,var(--bg-1) 55%,var(--bg-3) 100%);
  display:flex; flex-direction:column; min-height:100dvh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-3);outline-offset:3px;border-radius:var(--radius-sm)}

#canvas-container{position:fixed; inset:0; touch-action:none; z-index:1}
#canvas-container canvas{display:block; outline:none}

/* HUD TOP */
.hud-top{
  position:fixed; top:0; left:0; right:0;
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:12px;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  z-index:10;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
  pointer-events:none;
}
.hud-top > *{pointer-events:auto}
.hud-actions{display:flex; gap:8px; align-items:center}
.btn-icon{
  width:40px; height:40px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:17px;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--t-base);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text);
}
.btn-icon:hover{background:var(--surface-hover); transform:translateY(-2px)}
.btn-icon:active{transform:translateY(0) scale(.95)}
.btn-icon[hidden]{display:none}

.btn-install{
  animation:installPulse 2.4s ease-in-out infinite;
  background:rgba(74,222,128,.12);
  border-color:rgba(74,222,128,.4);
}
.btn-install:hover{background:rgba(74,222,128,.22)}
@keyframes installPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}
  50%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
}

.hud-title{
  text-align:center;
  font-weight:800; font-size:14px;
  letter-spacing:1px;
  color:var(--accent-3);
  text-shadow:0 0 12px rgba(125,211,252,.5);
}
.hud-stats{
  display:flex; gap:14px; font-size:11px;
  justify-content:center;
  font-variant-numeric:tabular-nums;
}
.hud-stats span{opacity:.7; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
.hud-stats b{color:var(--accent-3); font-weight:800; font-size:13px}

/* HINT TAG */
.hint-tag{
  position:fixed;
  top:calc(70px + var(--safe-top));
  left:50%; transform:translateX(-50%);
  padding:10px 18px;
  border-radius:var(--radius-full);
  background:rgba(251,191,36,.25);
  border:2px solid rgba(251,191,36,.7);
  color:#fde68a;
  font-size:13px; font-weight:800;
  z-index:9;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:all var(--t-base);
  pointer-events:none;
  text-align:center;
  max-width:92vw;
  box-shadow:0 0 30px rgba(251,191,36,.3);
  animation:fadeIn .5s ease;
}
.hint-tag.warn{
  background:rgba(251,191,36,.4);
  border-color:#fbbf24;
  color:#fffbeb;
  animation:pulseTag 1s ease-in-out infinite;
}
@keyframes pulseTag{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.05)}
}
@keyframes fadeIn{
  from{opacity:0; transform:translate(-50%,-10px)}
  to{opacity:1; transform:translate(-50%,0)}
}

/* TOASTS */
.toast-container{
  position:fixed;
  top:calc(120px + var(--safe-top));
  left:50%; transform:translateX(-50%);
  z-index:2000;
  display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:none;
  max-width:90vw;
}
.toast{
  color:#fff; padding:10px 18px;
  border-radius:var(--radius-full);
  font-weight:700; font-size:12px;
  box-shadow:var(--shadow-md);
  animation:toastIn .3s ease;
  max-width:90vw; text-align:center;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.toast.info{background:linear-gradient(135deg,var(--accent-1),var(--accent-2))}
.toast.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.toast.success{background:linear-gradient(135deg,var(--success),#15803d)}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}

/* HUD BOTTOM */
.hud-bottom{
  position:fixed;
  bottom:0; left:0; right:0;
  display:flex; justify-content:center; gap:8px;
  padding:14px 14px calc(14px + var(--safe-bottom));
  z-index:10;
  background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
  flex-wrap:wrap;
}
.btn{
  padding:11px 18px;
  border-radius:var(--radius-full);
  border:1px solid rgba(125,211,252,.3);
  background:var(--btn-bg);
  color:#fff;
  font-size:13px; font-weight:700;
  cursor:pointer;
  transition:all var(--t-base);
  display:inline-flex; align-items:center; gap:6px;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 6px 20px rgba(14,165,233,.5)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.secondary{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.15);
  box-shadow:none;
}
.btn.secondary:hover:not(:disabled){background:rgba(255,255,255,.15); box-shadow:none}

/* WIN MODAL */
.win-modal{
  position:fixed; inset:0;
  display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:100;
  padding:20px;
}
.win-modal.active{display:flex}
.win-card{
  background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
  border:1px solid rgba(125,211,252,.4);
  border-radius:var(--radius-xl);
  padding:32px 24px;
  text-align:center;
  max-width:380px; width:100%;
  box-shadow:var(--shadow-lg);
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.8); opacity:0} to{transform:scale(1); opacity:1}}
.win-emoji{font-size:56px; margin-bottom:8px; animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
.win-card h2{font-size:24px; color:var(--accent-3); margin:0 0 8px; font-weight:800}
.win-card p{opacity:.75; font-size:13px; margin:0 0 20px; color:var(--text-muted)}
.win-stats{
  display:flex; justify-content:space-around;
  padding:14px; background:rgba(125,211,252,.08);
  border-radius:var(--radius-md); margin-bottom:20px;
}
.win-stat-value{font-size:22px; font-weight:800; color:var(--accent-3)}
.win-stat-label{font-size:9px; text-transform:uppercase; color:var(--text-muted); letter-spacing:1px}

/* MENU */
.main-menu{
  position:fixed; inset:0;
  z-index:50;
  display:flex; flex-direction:column;
  padding:calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
  background:radial-gradient(circle at 50% 30%,var(--bg-2) 0%,var(--bg-1) 55%,var(--bg-3) 100%);
  overflow-y:auto;
  transition:opacity var(--t-slow), transform var(--t-slow);
}
.main-menu.hidden{opacity:0; transform:translateY(-20px); pointer-events:none}
.menu-header{text-align:center; margin-bottom:24px}
.menu-header h1{
  font-size:30px; margin:0 0 6px;
  font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent-3),var(--accent-1));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.menu-header p{color:var(--text-muted); font-size:13px; margin:0; letter-spacing:.5px}
.plane-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:14px;
  max-width:640px; margin:0 auto; width:100%;
}
.plane-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px 14px;
  text-align:center;
  cursor:pointer;
  transition:all var(--t-base);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:relative;
  overflow:hidden;
}
.plane-card:hover:not(.locked){
  background:var(--surface-hover);
  transform:translateY(-3px);
  border-color:var(--accent-3);
  box-shadow:var(--glow-cyan);
}
.plane-card.locked{opacity:.45; cursor:not-allowed}
.plane-card.locked::after{
  content:'🔒';
  position:absolute; top:8px; right:8px;
  font-size:18px;
}
.plane-card.completed::before{
  content:'✓';
  position:absolute; top:8px; left:8px;
  width:22px; height:22px;
  border-radius:50%;
  background:var(--success);
  color:#fff; font-size:13px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.plane-emoji{font-size:46px; margin-bottom:6px; display:block}
.plane-name{font-size:13px; font-weight:700; margin-bottom:4px}
.plane-parts{font-size:10px; text-transform:uppercase; color:var(--text-muted); letter-spacing:1px}

/* LOADING */
.loading{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px;
  background:var(--bg-1);
  z-index:300;
  font-size:13px; color:var(--accent-3);
  transition:opacity var(--t-slow);
}
.loading.hidden{opacity:0; pointer-events:none}
.loading-spinner{
  width:44px; height:44px;
  border:4px solid rgba(125,211,252,.2);
  border-top-color:var(--accent-3);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* CONFETTI */
.confetti-container{
  position:fixed; inset:0;
  pointer-events:none;
  z-index:99;
  overflow:hidden;
}
.confetti-piece{
  position:absolute;
  width:10px; height:14px;
  top:-20px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0.3;
  }
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="main-menu" id="main-menu">
  <div class="menu-header">
    <h1>✈️ AIRPLANE BUILDER</h1>
    <p>Monte aviões em 3D arrastando as peças</p>
  </div>
  <div class="plane-grid" id="plane-grid"></div>
</div>

<div class="hud-top" id="hud-top" style="display:none">
  <div class="hud-actions">
    <button class="btn-icon" id="btn-back" type="button" aria-label="Voltar" title="Menu">←</button>
    <button class="btn-icon" id="btn-sound" type="button" aria-label="Som" title="Som">🔊</button>
    <button class="btn-icon btn-install" id="btn-install" type="button" aria-label="Instalar" title="Instalar como app" hidden>⬇️</button>
  </div>
  <div>
    <div class="hud-title" id="hud-title">MONTAGEM</div>
    <div class="hud-stats">
      <span>Peças: <b id="stat-parts">0/0</b></span>
      <span>Movs: <b id="stat-moves">0</b></span>
      <span>Tempo: <b id="stat-time">0s</b></span>
    </div>
  </div>
  <button class="btn-icon" id="btn-restart" type="button" aria-label="Reiniciar" title="Reiniciar">🔄</button>
</div>

<div class="hint-tag" id="hint-tag" style="display:none">
  👆 Arraste as peças até o avião
</div>

<div class="hud-bottom" id="hud-bottom" style="display:none">
  <button class="btn secondary" id="btn-hint" type="button">💡 Dica</button>
  <button class="btn secondary" id="btn-reset-parts" type="button">↶ Reorganizar</button>
</div>

<div class="win-modal" id="win-modal">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2 id="win-title">Avião Montado!</h2>
    <p id="win-message">Conseguiste encaixar todas as peças.</p>
    <div class="win-stats">
      <div><div class="win-stat-value" id="win-moves">0</div><div class="win-stat-label">Movs</div></div>
      <div><div class="win-stat-value" id="win-time">0s</div><div class="win-stat-label">Tempo</div></div>
    </div>
    <button class="btn" id="btn-next-plane" type="button" style="width:100%; justify-content:center">▶ Próximo Avião</button>
  </div>
</div>

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div>Carregando Three.js...</div>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

   ============================================================ */
const Storage = {
  get(k, fb=null){ try{ const r=localStorage.getItem(k); return r===null?fb:r; }catch{ return fb; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch{} },
  getJSON(k, fb){ try{ const r=localStorage.getItem(k); return r===null?fb:JSON.parse(r); }catch{ return fb; } },
  setJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

const Toaster = (() => {
  const container = document.getElementById('toast-container');
  const queue = []; let active = false;
  const show = ({msg, type}) => {
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.textContent = msg;
    container.appendChild(el);
    let done = false;
    const finish = () => { if(done)return; done=true; el.remove(); active=false; next(); };
    setTimeout(finish, CONFIG.TOAST_DURATION);
    setTimeout(finish, CONFIG.TOAST_SAFETY);
  };
  const next = () => { if(active||!queue.length)return; active=true; show(queue.shift()); };
  const push = (msg,type) => { queue.push({msg,type}); next(); };
  return {
    info:    m => push(m,'info'),
    warn:    m => push(m,'warn'),
    success: m => push(m,'success')
  };
})();

const Sound = (() => {
  let ctx = null;
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.SOUND, '1') === '1';
  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  };
  const tone = (freq, type, dur, vol) => {
    if (!enabled) return;
    const ac = ensure(); if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator(); const g = ac.createGain();
    osc.frequency.value = freq; osc.type = type;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(now); osc.stop(now + dur);
  };
  return {
    isEnabled: () => enabled,
    toggle() { enabled = !enabled; Storage.set(CONFIG.STORAGE_KEYS.SOUND, enabled?'1':'0'); if(enabled) tone(880,'sine',.1,.1); return enabled; },
    pickup: () => { tone(500, 'sine', .06, .04); tone(750, 'sine', .08, .04); },
    snap:   () => { tone(720, 'triangle', .1, .08); tone(1080, 'sine', .15, .06); },
    wrong:  () => tone(220, 'sine', .12, .05),
    win()   {
      if (!enabled) return;
      const ac = ensure(); if (!ac) return;
      const now = ac.currentTime;
      [523, 659, 784, 1046, 1318].forEach((f,i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.frequency.value = f; o.type = 'sine';
        const t = now + i * .09;
        g.gain.setValueAtTime(.001, t);
        g.gain.exponentialRampToValueAtTime(.12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + .4);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + .4);
      });
    }
  };
})();

/* Voz em pt-BR */
const Voice = (() => {
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.VOICE, '1') === '1';
  let voice = null;
  let ready = false;

  const loadVoices = () => {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    voice = voices.find(v => v.lang.startsWith('pt-BR'))
         || voices.find(v => v.lang.startsWith('pt'))
         || voices[0];
    ready = true;
  };

  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  return {
    isEnabled: () => enabled && ready && 'speechSynthesis' in window,
    toggle() {
      enabled = !enabled;
      Storage.set(CONFIG.STORAGE_KEYS.VOICE, enabled ? '1' : '0');
      return enabled;
    },
    speak(text) {
      if (!enabled || !ready || !('speechSynthesis' in window)) return;
      try {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'pt-BR';
        utter.voice = voice;
        utter.rate = 0.95;
        utter.pitch = 1.15;
        utter.volume = 0.9;
        speechSynthesis.speak(utter);
      } catch (err) { /* silencioso */ }
    }
  };
})();

/* Partículas 3D — estrelinhas ao encaixar */
const createStarBurst = (scene, position, color) => {
  const particles = [];
  const count = 12;
  const geo = new THREE.SphereGeometry(0.08, 6, 6);

  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color });
    const star = new THREE.Mesh(geo, mat);
    star.position.copy(position);

    const angle = (i / count) * Math.PI * 2;
    const speed = 0.15 + Math.random() * 0.1;
    star.userData.velocity = new THREE.Vector3(
      Math.cos(angle) * speed,
      0.15 + Math.random() * 0.15,
      Math.sin(angle) * speed
    );
    star.userData.life = 1.0;

    scene.add(star);
    particles.push(star);
  }

  const t0 = performance.now();
  const animateParticles = () => {
    const t = (performance.now() - t0) / 1000;
    let alive = false;

    for (const p of particles) {
      if (p.userData.life <= 0) continue;
      alive = true;
      p.position.add(p.userData.velocity);
      p.userData.velocity.y -= 0.015;
      p.userData.life -= 0.02;
      p.material.opacity = Math.max(0, p.userData.life);
      p.material.transparent = true;
      p.scale.setScalar(Math.max(0.01, p.userData.life));
    }

    if (alive) requestAnimationFrame(animateParticles);
    else particles.forEach(p => scene.remove(p));
  };
  animateParticles();
};

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  currentPlane: null,
  placedParts: new Set(),
  totalParts: 0,
  moves: 0,
  startTime: 0,
  timerInterval: null,
  meshes: new Map(),
  slots: new Map(),
  draggable: [],
  completedPlanes: Storage.getJSON(CONFIG.STORAGE_KEYS.COMPLETED, []) || []
};

/* ============================================================
   GEOMETRIA
   ============================================================ */
const buildGeometry = (geoDef) => {
  const [type, params] = geoDef;
  switch (type) {
    case 'box':      return new THREE.BoxGeometry(...params);
    case 'cylinder': return new THREE.CylinderGeometry(...params);
    case 'cone':     return new THREE.ConeGeometry(...params);
    case 'sphere':   return new THREE.SphereGeometry(...params);
    default:         return new THREE.BoxGeometry(1,1,1);
  }
};

/* ============================================================
   CARREGAR AVIÃO
   ============================================================ */
const clearScene = () => {
  for (const m of state.meshes.values()) scene.remove(m);
  for (const s of state.slots.values()) scene.remove(s);
  state.meshes.clear();
  state.slots.clear();
  state.draggable.length = 0;
  state.placedParts.clear();
};

const loadPlane = (planeId) => {
  const plane = AIRPLANES.find(p => p.id === planeId);
  if (!plane) return;

  clearScene();
  state.currentPlane = plane;
  state.placedParts.clear();
  state.moves = 0;
  state.startTime = Date.now();
  state.totalParts = plane.parts.length;

  /* Ghosts dourados pulsantes */
  plane.parts.forEach(part => {
    const geo = buildGeometry(part.geo);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xfbbf24,
      transparent: true,
      opacity: 0.35,
      wireframe: true
    });
    const ghost = new THREE.Mesh(geo, mat);
    ghost.position.set(...part.slot.pos);
    ghost.rotation.set(...part.slot.rot);
    ghost.userData.isGhost = true;
    scene.add(ghost);
    state.slots.set(part.id, ghost);
  });

  /* Peças arrastáveis — cores vivas e brilho sutil */
  plane.parts.forEach((part, i) => {
    const geo = buildGeometry(part.geo);
    const mat = new THREE.MeshStandardMaterial({
      color: part.color,
      metalness: 0.15,
      roughness: 0.4,
      emissive: part.color,
      emissiveIntensity: 0.15
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.partId = part.id;

    /* Posição inicial em arco — espaçamento generoso */
    const angle = (i / plane.parts.length) * Math.PI - Math.PI/2;
    const radius = 6;
    mesh.position.set(
      Math.cos(angle) * radius * 1.3,
      -0.3,
      Math.sin(angle) * radius * 0.7 + 5
    );
    mesh.rotation.set(
      Math.random()*0.4 - 0.2,
      Math.random()*Math.PI*2,
      Math.random()*0.4 - 0.2
    );
    mesh.userData.originPosition = mesh.position.clone();

    scene.add(mesh);
    state.meshes.set(part.id, mesh);
    state.draggable.push(mesh);
  });

  const dist = 7.5 + plane.parts.length * 0.15;
  camera.position.set(dist * 0.7, dist * 0.55, dist);
  controls.target.set(0, 0.6, 0);

  updateHUD();
  Voice.speak(`Vamos montar o ${plane.name}!`);
};

/* ============================================================
   DRAG & DROP 3D
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const dragOffset = new THREE.Vector3();
const intersectPoint = new THREE.Vector3();
let draggingObject = null;
let hoveredObject = null;

const updatePointer = (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
};

const onPointerDown = (e) => {
  if (e.target !== renderer.domElement) return;
  if (document.getElementById('main-menu').offsetParent !== null) return;

  resetIdleTimer();
  clearTimeout(hintTimeout);

  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(state.draggable, false);
  if (!hits.length) return;

  draggingObject = hits[0].object;
  if (state.placedParts.has(draggingObject.userData.partId)) {
    draggingObject = null;
    return;
  }

  controls.enabled = false;
  Sound.pickup();
  Voice.speak(`Pegou a ${draggingObject.userData.partId}.`);

  dragPlane.setFromNormalAndCoplanarPoint(
    new THREE.Vector3(0,1,0), draggingObject.position
  );
  raycaster.ray.intersectPlane(dragPlane, intersectPoint);
  dragOffset.copy(draggingObject.position).sub(intersectPoint);

  /* Escala ao pegar */
  draggingObject.userData._scale = 1;
  const scaleUp = () => {
    if (!draggingObject) return;
    draggingObject.userData._scale = Math.min(CONFIG.PICKUP_SCALE, draggingObject.userData._scale + 0.05);
    draggingObject.scale.setScalar(draggingObject.userData._scale);
    if (draggingObject.userData._scale < CONFIG.PICKUP_SCALE) requestAnimationFrame(scaleUp);
  };
  scaleUp();

  renderer.domElement.setPointerCapture?.(e.pointerId);
};

const onPointerMove = (e) => {
  if (!draggingObject) return;
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
    draggingObject.position.copy(intersectPoint.add(dragOffset));
  }
};

const onPointerUp = () => {
  if (!draggingObject) return;

  draggingObject.userData._scale = CONFIG.PICKUP_SCALE;
  const scaleDown = () => {
    if (!draggingObject) return;
    draggingObject.userData._scale = Math.max(1, draggingObject.userData._scale - 0.05);
    draggingObject.scale.setScalar(draggingObject.userData._scale);
    if (draggingObject.userData._scale > 1) requestAnimationFrame(scaleDown);
    else draggingObject.scale.setScalar(1);
  };
  scaleDown();

  const partId = draggingObject.userData.partId;
  const slot = state.slots.get(partId);
  const plane = state.currentPlane;
  const part = plane.parts.find(p => p.id === partId);

  const dist = draggingObject.position.distanceTo(slot.position);

  if (dist < CONFIG.SNAP_DISTANCE) {
    snapToSlot(draggingObject, part, slot);
  } else {
    Sound.wrong();
    returnToOrigin(draggingObject);
  }

  draggingObject = null;
  controls.enabled = true;
  resetIdleTimer();
};

const snapToSlot = (mesh, part, slot) => {
  const startPos = mesh.position.clone();
  const startRot = mesh.rotation.clone();
  const targetPos = slot.position.clone();
  const targetRot = new THREE.Euler(...part.slot.rot);

  const t0 = performance.now();
  const animate = () => {
    const t = Math.min((performance.now() - t0) / CONFIG.SNAP_ANIM_MS, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    mesh.position.lerpVectors(startPos, targetPos, ease);
    mesh.rotation.x = startRot.x + (targetRot.x - startRot.x) * ease;
    mesh.rotation.y = startRot.y + (targetRot.y - startRot.y) * ease;
    mesh.rotation.z = startRot.z + (targetRot.z - startRot.z) * ease;

    if (t < 1) requestAnimationFrame(animate);
    else onSnapped(mesh, slot, part);
  };
  animate();
};

const onSnapped = (mesh, slot, part) => {
  slot.visible = false;

  /* Brilho verde temporário */
  mesh.material.emissive = new THREE.Color(0x4ade80);
  mesh.material.emissiveIntensity = 0.7;
  setTimeout(() => {
    mesh.material.emissive = new THREE.Color(part.color);
    mesh.material.emissiveIntensity = 0.15;
  }, 500);

  /* Partículas de estrelinhas */
  createStarBurst(scene, slot.position.clone(), part.color);

  state.placedParts.add(mesh.userData.partId);
  state.moves++;
  Sound.snap();
  Voice.speak(`Boa! ${part.name} encaixada.`);
  updateHUD();

  if (state.placedParts.size === state.totalParts) {
    setTimeout(onWin, 600);
  }
};

const returnToOrigin = (mesh) => {
  const origin = mesh.userData.originPosition.clone();
  const startPos = mesh.position.clone();
  const t0 = performance.now();
  const shakeAxis = Math.random() > 0.5 ? 1 : -1;

  const animate = () => {
    const t = Math.min((performance.now() - t0) / CONFIG.RETURN_ANIM_MS, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    mesh.position.lerpVectors(startPos, origin, ease);
    if (t < 0.4) {
      mesh.position.x += Math.sin(t * 30) * 0.15 * shakeAxis * (1 - t);
    }
    if (t < 1) requestAnimationFrame(animate);
  };
  animate();
};

/* Hover */
const onPointerHover = (e) => {
  if (draggingObject) return;
  if (document.getElementById('main-menu').offsetParent !== null) return;

  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(state.draggable, false);

  if (hits.length > 0) {
    const obj = hits[0].object;
    if (state.placedParts.has(obj.userData.partId)) return;
    if (obj !== hoveredObject) {
      if (hoveredObject) hoveredObject.scale.setScalar(1);
      hoveredObject = obj;
      renderer.domElement.style.cursor = 'grab';
    }
    const target = CONFIG.HOVER_SCALE;
    if (obj.scale.x < target) obj.scale.setScalar(Math.min(target, obj.scale.x + 0.05));
  } else {
    if (hoveredObject) {
      hoveredObject.scale.setScalar(1);
      hoveredObject = null;
      renderer.domElement.style.cursor = '';
    }
  }
};

renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerHover);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

$('btn-reset-parts').addEventListener('click', () => {
  if (!state.currentPlane) return;
  let i = 0;
  const plane = state.currentPlane;
  plane.parts.forEach(part => {
    if (state.placedParts.has(part.id)) return;

    if (!mesh) return;
    const angle = (i / plane.parts.length) * Math.PI - Math.PI/2;
    const radius = 6;
    mesh.position.set(
      Math.cos(angle) * radius * 1.3,
      -0.3,
      Math.sin(angle) * radius * 0.7 + 5
    );
    mesh.rotation.set(0, Math.random()*Math.PI*2, 0);
    mesh.userData.originPosition = mesh.position.clone();
    i++;
  });
  Toaster.info('↶ Peças reorganizadas');
});

$('btn-hint').addEventListener('click', () => {
  showAutoHint();
});

$('btn-next-plane').addEventListener('click', () => {
  const idx = AIRPLANES.indexOf(state.currentPlane);
  const next = AIRPLANES[idx + 1];
  if (next) {
    $('win-modal').classList.remove('active');
    startPlane(next.id);
  } else {
    Toaster.success('🏆 Parabéns! Montaste todos!');
    backToMenu();
  }
});

$('btn-sound').addEventListener('click', () => {
  const on = Sound.toggle();
  $('btn-sound').textContent = on ? '🔊' : '🔇';
  Toaster.info(on ? 'Som ligado' : 'Som desligado');
});

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   AUTO-DICA
   ============================================================ */
let lastInteraction = Date.now();
let hintTimeout = null;

const resetIdleTimer = () => {
  lastInteraction = Date.now();
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(showAutoHint, CONFIG.HINT_TIMEOUT_MS);
};

const showAutoHint = () => {
  if (!state.currentPlane) return;
  if (state.placedParts.size >= state.totalParts) return;

  const remaining = state.currentPlane.parts.filter(p => !state.placedParts.has(p.id));
  if (remaining.length === 0) return;

  const pick = remaining[0];
  const mesh = state.meshes.get(pick.id);
  const slot = state.slots.get(pick.id);
  if (!mesh || !slot) return;

  /* Brilha a peça */
  mesh.material.emissive = new THREE.Color(0xffffff);
  const t0 = performance.now();
  const pulse = () => {
    const t = (performance.now() - t0) / 1000;
    if (t > 2.5) {
      mesh.material.emissive = new THREE.Color(pick.color);
      mesh.material.emissiveIntensity = 0.15;
      return;
    }
    mesh.material.emissiveIntensity = 0.3 + Math.sin(t * 12) * 0.25;
    requestAnimationFrame(pulse);
  };
  pulse();

  /* Pisca o slot */
  const startScale = slot.scale.x;
  const start = performance.now();
  const anim = () => {
    const t = (performance.now() - start) / 250;
    if (t < 1) {
      slot.scale.setScalar(startScale * (1 + Math.sin(t * Math.PI) * 0.5));
      requestAnimationFrame(anim);
    } else {
      slot.scale.setScalar(startScale);
    }
  };
  anim();

  Toaster.info(`💡 Tente: ${pick.name}`);
  Voice.speak(`Agora encaixe a ${pick.name}`);
};

['pointerdown','pointermove','touchstart','keydown'].forEach(evt => {
  window.addEventListener(evt, resetIdleTimer, { passive: true });
});

/* ============================================================
   LOOP
   ============================================================ */
const clock = new THREE.Clock();
const animate = () => {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  for (const [id, mesh] of state.meshes) {
    if (state.placedParts.has(id) || mesh === draggingObject) continue;
    const baseY = mesh.userData.originPosition?.y ?? -0.3;
    mesh.position.y = baseY + Math.sin(time * 1.5 + mesh.position.x) * 0.06;
    mesh.rotation.y += 0.004;
  }

  /* Hélice gira */
  const propeller = state.meshes.get('propeller');
  if (propeller && state.placedParts.has('propeller')) {
    propeller.rotation.x += 0.18;
  }

  /* Ghosts pulsantes */
  for (const ghost of state.slots.values()) {
    if (ghost.visible) {
      const pulse = 0.7 + Math.sin(time * 2.5) * 0.3;
      ghost.material.opacity = 0.25 + pulse * 0.25;
      ghost.scale.setScalar(0.98 + pulse * 0.05);
    }
  }

  controls.update();
  renderer.render(scene, camera);
};
animate();

/* ============================================================
   PWA
   ============================================================ */
const PWA = (() => {
  let deferredPrompt = null;
  const btnInstall = $('btn-install');

  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const init = () => {
    if (isStandalone() && btnInstall) btnInstall.hidden = true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (btnInstall && !isStandalone()) btnInstall.hidden = false;
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      if (btnInstall) btnInstall.hidden = true;
      Toaster.success('✅ App instalado!');
    });

    btnInstall?.addEventListener('click', async () => {
      if (!deferredPrompt) {
        Toaster.info('Use o menu do navegador para instalar');
        return;
      }
      try {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') Toaster.success('🎉 Instalando...');
        deferredPrompt = null;
        btnInstall.hidden = true;
      } catch (err) { console.warn('[PWA]', err); }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('[SW]', err));
      });
    }
  };

  return { init };
})();

/* ============================================================
   BOOT
   ============================================================ */
$('btn-sound').textContent = Sound.isEnabled() ? '🔊' : '🔇';
renderMenu();
PWA.init();
resetIdleTimer();
setTimeout(() => $('loading').classList.add('hidden'), 300);
</script>
