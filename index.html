<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Airplane Builder 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{
    height:100%; margin:0; overflow:hidden;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    color:#f0f9ff;
    background:radial-gradient(circle at 50% 30%,#1e3a5f 0%,#0a1628 55%,#050d18 100%);
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #canvas-container{position:fixed; inset:0; touch-action:none; z-index:1}
  #canvas-container canvas{display:block; outline:none}

  .hud-top{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; z-index:10;
    background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);
    pointer-events:none;
  }
  .hud-top > *{pointer-events:auto}
  .hud-title{
    font-weight:800; font-size:14px;
    letter-spacing:1px; color:#7dd3fc;
    text-shadow:0 0 12px rgba(125,211,252,.5);
  }
  .hud-bottom{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:8px;
    padding:16px; z-index:10;
    background:linear-gradient(to top,rgba(0,0,0,.5),transparent);
    pointer-events:none;
  }
  .hud-bottom > *{pointer-events:auto}
  .btn{
    padding:11px 18px;
    border-radius:999px;
    border:1px solid rgba(125,211,252,.3);
    background:linear-gradient(135deg,#0ea5e9,#3b82f6);
    color:#fff; font-size:13px; font-weight:700;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .2s;
    box-shadow:0 4px 14px rgba(14,165,233,.35);
    font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.secondary{background:rgba(255,255,255,.1)}
  .loading{
    position:fixed; inset:0; display:flex;
    align-items:center; justify-content:center;
    background:#0a1628; z-index:300;
    font-size:14px; color:#7dd3fc;
    transition:opacity .4s;
  }
  .loading.hidden{opacity:0; pointer-events:none}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud-top">
  <div class="hud-title">✈️ AVIÃO DE PAPEL</div>
  <div style="font-size:12px; color:#94a3b8;">Arraste as 5 peças</div>
</div>

<div class="hud-bottom">
  <button class="btn secondary" id="btn-reset" type="button">🔄 Reiniciar</button>
</div>

<div class="loading" id="loading">Carregando Three.js...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import './game.js';
document.getElementById('loading').classList.add('hidden');

document.getElementById('btn-reset').addEventListener('click', () => location.reload());
</script>
</body>
</html>
