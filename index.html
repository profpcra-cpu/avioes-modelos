<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Airplane Builder 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{
    height:100%; margin:0; overflow:hidden;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    color:#f0f9ff;
    background:radial-gradient(circle at 50% 30%,#1e3a5f 0%,#0a1628 55%,#050d18 100%);
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

  #canvas-container{position:fixed; inset:0; touch-action:none; z-index:1}
  #canvas-container canvas{display:block; outline:none}

  /* HUD TOP */
  .hud-top{
    position:fixed; top:0; left:0; right:0;
    display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:12px;
    padding:12px 16px; z-index:10;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
    pointer-events:none;
  }
  .hud-top > *{pointer-events:auto}
  .btn-icon{
    width:40px; height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(125,211,252,.2);
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s;
    color:#f0f9ff;
  }
  .btn-icon:hover{background:rgba(255,255,255,.15); transform:translateY(-2px)}

  .hud-title{
    text-align:center;
    font-weight:800; font-size:14px;
    letter-spacing:1px; color:#7dd3fc;
    text-shadow:0 0 12px rgba(125,211,252,.5);
  }
  .hud-stats{
    display:flex; gap:14px; font-size:11px;
    justify-content:center;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .hud-stats span{opacity:.7; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
  .hud-stats b{color:#7dd3fc; font-weight:800; font-size:13px}

  /* HUD BOTTOM */
  .hud-bottom{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:8px;
    padding:16px; z-index:10;
    background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
    pointer-events:none;
  }
  .hud-bottom > *{pointer-events:auto}
  .btn{
    padding:11px 18px;
    border-radius:999px;
    border:1px solid rgba(125,211,252,.3);
    background:linear-gradient(135deg,#0ea5e9,#3b82f6);
    color:#fff; font-size:13px; font-weight:700;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .2s;
    box-shadow:0 4px 14px rgba(14,165,233,.35);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.secondary{background:rgba(255,255,255,.1)}

  /* MENU */
  .main-menu{
    position:fixed; inset:0;
    z-index:50;
    display:flex; flex-direction:column;
    padding:24px 20px;
    background:radial-gradient(circle at 50% 30%,#1e3a5f 0%,#0a1628 55%,#050d18 100%);
    overflow-y:auto;
    transition:opacity .4s, transform .4s;
  }
  .main-menu.hidden{opacity:0; transform:translateY(-20px); pointer-events:none}
  .menu-header{text-align:center; margin-bottom:24px}
  .menu-header h1{
    font-size:30px; margin:0 0 6px;
    font-weight:800; letter-spacing:1px;
    background:linear-gradient(135deg,#7dd3fc,#0ea5e9);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .menu-header p{color:#94a3b8; font-size:13px; margin:0}
  .plane-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:14px;
    max-width:640px; margin:0 auto; width:100%;
  }
  .plane-card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(125,211,252,.2);
    border-radius:16px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    transition:all .25s;
    position:relative;
    overflow:hidden;
  }
  .plane-card:hover:not(.locked){
    background:rgba(255,255,255,.12);
    transform:translateY(-3px);
    border-color:#7dd3fc;
    box-shadow:0 0 24px rgba(125,211,252,.5);
  }
  .plane-card.locked{opacity:.45; cursor:not-allowed}
  .plane-card.locked::after{content:'🔒'; position:absolute; top:8px; right:8px; font-size:18px}
  .plane-card.completed::before{
    content:'✓';
    position:absolute; top:8px; left:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:#4ade80;
    color:#fff; font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .plane-emoji{font-size:46px; margin-bottom:6px; display:block}
  .plane-name{font-size:13px; font-weight:700; margin-bottom:4px}
  .plane-parts{font-size:10px; text-transform:uppercase; color:#94a3b8; letter-spacing:1px}

  /* WIN MODAL */
  .win-modal{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
    z-index:100;
    padding:20px;
  }
  .win-modal.active{display:flex}
  .win-card{
    background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
    border:1px solid rgba(125,211,252,.4);
    border-radius:24px;
    padding:28px 22px;
    text-align:center;
    max-width:380px; width:100%;
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.8); opacity:0} to{transform:scale(1); opacity:1}}
  .win-emoji{font-size:52px; margin-bottom:8px}
  .win-card h2{font-size:22px; color:#7dd3fc; margin:0 0 8px; font-weight:800}
  .win-card p{opacity:.75; font-size:13px; margin:0 0 16px; color:#94a3b8}
  .win-stats{
    display:flex; justify-content:space-around;
    padding:14px; background:rgba(125,211,252,.08);
    border-radius:12px; margin-bottom:16px;
  }
  .win-stat-value{font-size:22px; font-weight:800; color:#7dd3fc}
  .win-stat-label{font-size:9px; text-transform:uppercase; color:#94a3b8; letter-spacing:1px}

  /* LOADING */
  .loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#0a1628;
    z-index:300;
    font-size:14px; color:#7dd3fc;
    transition:opacity .4s;
  }
  .loading.hidden{opacity:0; pointer-events:none}
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- MENU -->
<div class="main-menu" id="main-menu">
  <div class="menu-header">
    <h1>✈️ AIRPLANE BUILDER</h1>
    <p>Escolha um avião para montar</p>
  </div>
  <div class="plane-grid" id="plane-grid"></div>
</div>

<!-- HUD TOP -->
<div class="hud-top" id="hud-top" style="display:none">
  <button class="btn-icon" id="btn-back" type="button" aria-label="Voltar">←</button>
  <div>
    <div class="hud-title" id="hud-title">AVIÃO</div>
    <div class="hud-stats">
      <span>Peças: <b id="stat-parts">0/0</b></span>
      <span>Movs: <b id="stat-moves">0</b></span>
      <span>Tempo: <b id="stat-time">0s</b></span>
    </div>
  </div>
  <div></div>
</div>

<!-- HUD BOTTOM -->
<div class="hud-bottom" id="hud-bottom" style="display:none">
  <button class="btn secondary" id="btn-reset" type="button">🔄 Reiniciar</button>
</div>

<!-- WIN MODAL -->
<div class="win-modal" id="win-modal">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2 id="win-title">Avião Montado!</h2>
    <p id="win-message">Parabéns!</p>
    <div class="win-stats">
      <div><div class="win-stat-value" id="win-moves">0</div><div class="win-stat-label">Movs</div></div>
      <div><div class="win-stat-value" id="win-time">0s</div><div class="win-stat-label">Tempo</div></div>
    </div>
    <button class="btn" id="btn-next" type="button" style="width:100%; justify-content:center">▶ Próximo Avião</button>
  </div>
</div>

<div class="loading" id="loading">Carregando...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./game.js"></script>
</body>
</html>
