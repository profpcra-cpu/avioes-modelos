<html lang="pt-BR">

<link rel="manifest" href="manifest.json">

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg-1:#0a1628; --bg-2:#1e3a5f; --bg-3:#050d18;
  --text:#f0f9ff; --text-muted:#94a3b8; --text-dim:#475569;
  --surface:rgba(255,255,255,.06);
  --surface-hover:rgba(255,255,255,.12);
  --border:rgba(125,211,252,.2);
  --accent-1:#0ea5e9; --accent-2:#3b82f6; --accent-3:#7dd3fc;
  --success:#4ade80; --warning:#fbbf24; --danger:#ef4444;
  --btn-bg:linear-gradient(135deg,#0ea5e9,#3b82f6);
  --btn-accent:linear-gradient(135deg,#06b6d4,#0891b2);
  --shadow-sm:0 4px 12px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --glow-cyan:0 0 24px rgba(125,211,252,.5);
  --glow-green:0 0 24px rgba(74,222,128,.5);
  --t-fast:.15s cubic-bezier(.16,1,.3,1);
  --t-base:.25s cubic-bezier(.16,1,.3,1);
  --t-slow:.4s cubic-bezier(.16,1,.3,1);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
  --radius-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{
  height:100%; margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body{
  background:radial-gradient(circle at 50% 30%,var(--bg-2) 0%,var(--bg-1) 55%,var(--bg-3) 100%);
  display:flex; flex-direction:column; min-height:100dvh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-3);outline-offset:3px;border-radius:var(--radius-sm)}

/* ============================================================
   CANVAS 3D
   ============================================================ */
#canvas-container{
  position:fixed; inset:0;
  touch-action:none;
  z-index:1;
}
#canvas-container canvas{display:block; outline:none}

/* ============================================================
   HUD SUPERIOR
   ============================================================ */
.hud-top{
  position:fixed; top:0; left:0; right:0;
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:12px;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  z-index:10;
  background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);
  pointer-events:none;
}
.hud-top > *{pointer-events:auto}

.hud-actions{display:flex; gap:8px; align-items:center}
.btn-icon{
  width:38px; height:38px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--t-base);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text);
}
.btn-icon:hover{background:var(--surface-hover); transform:translateY(-2px)}
.btn-icon:active{transform:translateY(0) scale(.95)}
.btn-icon[hidden]{display:none}

.btn-install{
  animation:installPulse 2.4s ease-in-out infinite;
  background:rgba(74,222,128,.12);
  border-color:rgba(74,222,128,.4);
}
.btn-install:hover{background:rgba(74,222,128,.22)}
@keyframes installPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}
  50%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
}

.hud-title{
  text-align:center;
  font-weight:800; font-size:14px;
  letter-spacing:1px;
  color:var(--accent-3);
  text-shadow:0 0 12px rgba(125,211,252,.5);
}

.hud-stats{
  display:flex; gap:14px; font-size:11px;
  justify-content:center;
  font-variant-numeric:tabular-nums;
}
.hud-stats span{opacity:.7; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
.hud-stats b{color:var(--accent-3); font-weight:800; font-size:13px}

/* ============================================================
   TOASTS
   ============================================================ */
.toast-container{
  position:fixed;
  top:calc(80px + var(--safe-top));
  left:50%; transform:translateX(-50%);
  z-index:2000;
  display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:none;
  max-width:90vw;
}
.toast{
  color:#fff; padding:8px 16px;
  border-radius:var(--radius-full);
  font-weight:700; font-size:11px;
  box-shadow:var(--shadow-md);
  animation:toastIn .3s ease;
  max-width:90vw; text-align:center;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.toast.info{background:linear-gradient(135deg,var(--accent-1),var(--accent-2))}
.toast.warn{background:linear-gradient(135deg,var(--warning),#d97706)}
.toast.success{background:linear-gradient(135deg,var(--success),#15803d)}
@keyframes toastIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   HINT TAG
   ============================================================ */
.hint-tag{
  position:fixed;
  top:calc(66px + var(--safe-top));
  left:50%; transform:translateX(-50%);
  padding:8px 16px;
  border-radius:var(--radius-full);
  background:rgba(125,211,252,.15);
  border:1px solid rgba(125,211,252,.4);
  color:var(--accent-3);
  font-size:11px; font-weight:700;
  animation:fadeIn .5s ease;
  z-index:9;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:all var(--t-base);
  pointer-events:none;
  text-align:center;
  max-width:92vw;
}
.hint-tag.warn{
  background:rgba(251,191,36,.15);
  border-color:rgba(251,191,36,.4);
  color:var(--warning);
}
@keyframes fadeIn{
  from{opacity:0; transform:translate(-50%,-10px)}
  to{opacity:1; transform:translate(-50%,0)}
}

/* ============================================================
   HUD INFERIOR
   ============================================================ */
.hud-bottom{
  position:fixed;
  bottom:0; left:0; right:0;
  display:flex; justify-content:center; gap:8px;
  padding:14px 14px calc(14px + var(--safe-bottom));
  z-index:10;
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent);
  flex-wrap:wrap;
}
.btn{
  padding:10px 16px;
  border-radius:var(--radius-full);
  border:1px solid rgba(125,211,252,.3);
  background:var(--btn-bg);
  color:#fff;
  font-size:12px; font-weight:700;
  cursor:pointer;
  transition:all var(--t-base);
  display:inline-flex; align-items:center; gap:6px;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 6px 20px rgba(14,165,233,.5)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.secondary{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.15);
  box-shadow:none;
}
.btn.secondary:hover:not(:disabled){background:rgba(255,255,255,.15); box-shadow:none}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none!important}

/* ============================================================
   MODAL DE VITÓRIA
   ============================================================ */
.win-modal{
  position:fixed; inset:0;
  display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:100;
  padding:20px;
}
.win-modal.active{display:flex}
.win-card{
  background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
  border:1px solid rgba(125,211,252,.4);
  border-radius:var(--radius-xl);
  padding:32px 24px;
  text-align:center;
  max-width:380px; width:100%;
  box-shadow:var(--shadow-lg);
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{
  from{transform:scale(.8); opacity:0}
  to{transform:scale(1); opacity:1}
}
.win-emoji{font-size:52px; margin-bottom:8px; animation:bounce 1s ease infinite}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
.win-card h2{
  font-size:22px; color:var(--accent-3);
  margin:0 0 8px; font-weight:800;
}
.win-card p{
  opacity:.75; font-size:13px;
  margin:0 0 20px; color:var(--text-muted);
}
.win-stats{
  display:flex; justify-content:space-around;
  padding:14px; background:rgba(125,211,252,.08);
  border-radius:var(--radius-md); margin-bottom:20px;
}
.win-stat-value{font-size:20px; font-weight:800; color:var(--accent-3)}
.win-stat-label{
  font-size:9px; text-transform:uppercase;
  color:var(--text-muted); letter-spacing:1px;
}

/* ============================================================
   MENU PRINCIPAL (Seleção de Aviões)
   ============================================================ */
.main-menu{
  position:fixed; inset:0;
  z-index:50;
  display:flex; flex-direction:column;
  padding:calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
  background:radial-gradient(circle at 50% 30%,var(--bg-2) 0%,var(--bg-1) 55%,var(--bg-3) 100%);
  overflow-y:auto;
  transition:opacity var(--t-slow), transform var(--t-slow);
}
.main-menu.hidden{
  opacity:0; transform:translateY(-20px);
  pointer-events:none;
}
.menu-header{
  text-align:center; margin-bottom:24px;
}
.menu-header h1{
  font-size:28px; margin:0 0 6px;
  font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent-3),var(--accent-1));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.menu-header p{
  color:var(--text-muted); font-size:12px;
  margin:0; letter-spacing:.5px;
}
.plane-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:14px;
  max-width:600px; margin:0 auto; width:100%;
}
.plane-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px 12px;
  text-align:center;
  cursor:pointer;
  transition:all var(--t-base);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:relative;
  overflow:hidden;
}
.plane-card:hover:not(.locked){
  background:var(--surface-hover);
  transform:translateY(-3px);
  border-color:var(--accent-3);
  box-shadow:var(--glow-cyan);
}
.plane-card.locked{
  opacity:.45; cursor:not-allowed;
}
.plane-card.locked::after{
  content:'🔒';
  position:absolute; top:8px; right:8px;
  font-size:16px;
}
.plane-card.completed::before{
  content:'✓';
  position:absolute; top:8px; left:8px;
  width:20px; height:20px;
  border-radius:50%;
  background:var(--success);
  color:#fff; font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.plane-emoji{font-size:42px; margin-bottom:6px; display:block}
.plane-name{font-size:12px; font-weight:700; margin-bottom:4px}
.plane-parts{
  font-size:9px; text-transform:uppercase;
  color:var(--text-muted); letter-spacing:1px;
}

/* ============================================================
   LOADING
   ============================================================ */
.loading{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px;
  background:var(--bg-1);
  z-index:300;
  font-size:13px; color:var(--accent-3);
  transition:opacity var(--t-slow);
}
.loading.hidden{opacity:0; pointer-events:none}
.loading-spinner{
  width:40px; height:40px;
  border:3px solid rgba(125,211,252,.2);
  border-top-color:var(--accent-3);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ CANVAS 3D ============ -->
<div id="canvas-container"></div>

<!-- ============ MENU PRINCIPAL ============ -->
<div class="main-menu" id="main-menu">
  <div class="menu-header">
    <h1>✈️ AIRPLANE BUILDER</h1>
    <p>Monte aviões em 3D arrastando as peças</p>
  </div>
  <div class="plane-grid" id="plane-grid"></div>
</div>

<!-- ============ HUD SUPERIOR ============ -->
<div class="hud-top" id="hud-top" style="display:none">
  <div class="hud-actions">
    <button class="btn-icon" id="btn-back" type="button" aria-label="Voltar ao menu" title="Menu">←</button>
    <button class="btn-icon" id="btn-sound" type="button" aria-label="Alternar som" title="Som">🔊</button>
    <button class="btn-icon btn-install" id="btn-install" type="button" aria-label="Instalar aplicativo" title="Instalar como app" hidden>⬇️</button>
  </div>
  <div>
    <div class="hud-title" id="hud-title">MONTAGEM</div>
    <div class="hud-stats">
      <span>Peças: <b id="stat-parts">0/0</b></span>
      <span>Movs: <b id="stat-moves">0</b></span>
      <span>Tempo: <b id="stat-time">0s</b></span>
    </div>
  </div>
  <button class="btn-icon" id="btn-restart" type="button" aria-label="Reiniciar" title="Reiniciar">🔄</button>
</div>

<!-- ============ HINT TAG ============ -->
<div class="hint-tag" id="hint-tag" style="display:none">
  🖱️ Arraste as peças até o avião
</div>

<!-- ============ HUD INFERIOR ============ -->
<div class="hud-bottom" id="hud-bottom" style="display:none">
  <button class="btn secondary" id="btn-hint" type="button">💡 Dica</button>
  <button class="btn secondary" id="btn-reset-parts" type="button">↶ Reorganizar</button>
</div>

<!-- ============ MODAL DE VITÓRIA ============ -->
<div class="win-modal" id="win-modal">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2 id="win-title">Avião Montado!</h2>
    <p id="win-message">Conseguiste encaixar todas as peças.</p>
    <div class="win-stats">
      <div><div class="win-stat-value" id="win-moves">0</div><div class="win-stat-label">Movs</div></div>
      <div><div class="win-stat-value" id="win-time">0s</div><div class="win-stat-label">Tempo</div></div>
    </div>
    <button class="btn" id="btn-next-plane" type="button" style="width:100%; justify-content:center">▶ Próximo Avião</button>
  </div>
</div>

<!-- ============ TOASTS ============ -->
<div class="toast-container" id="toast-container" aria-live="polite"></div>

<!-- ============ LOADING ============ -->
<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div>Carregando Three.js...</div>
</div>

<!-- ============ THREE.JS ============ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

      { id:'fin', name:'Fin Vertical', color:0x1e40af, geo:['box',[0.8,1.2,0.1]], slot:{pos:[-2.3,1.1,0], rot:[0,0,0]} },
      { id:'engine-l', name:'Motor Esq.', color:0x475569, geo:['cylinder',[0.3,0.3,1,12]], slot:{pos:[0.2,0.15,-1.8], rot:[0,0,Math.PI/2]} },
      { id:'engine-r', name:'Motor Dir.', color:0x475569, geo:['cylinder',[0.3,0.3,1,12]], slot:{pos:[0.2,0.15,1.8], rot:[0,0,Math.PI/2]} },
      { id:'nose', name:'Nariz', color:0x0ea5e9, geo:['cone',[0.5,0.6,16]], slot:{pos:[2.7,0.5,0], rot:[0,0,-Math.PI/2]} }
    ]
  }
];

/* ============================================================
   UTILS
   ============================================================ */
const Storage = {
  get(k, fb=null){ try{ const r=localStorage.getItem(k); return r===null?fb:r; }catch{ return fb; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch{} },
  getJSON(k, fb){ try{ const r=localStorage.getItem(k); return r===null?fb:JSON.parse(r); }catch{ return fb; } },
  setJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

const Toaster = (() => {
  const container = document.getElementById('toast-container');
  const queue = []; let active = false;
  const show = ({msg, type}) => {
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.textContent = msg;
    container.appendChild(el);
    let done = false;
    const finish = () => { if(done)return; done=true; el.remove(); active=false; next(); };
    setTimeout(finish, CONFIG.TOAST_DURATION);
    setTimeout(finish, CONFIG.TOAST_SAFETY);
  };
  const next = () => { if(active||!queue.length)return; active=true; show(queue.shift()); };
  const push = (msg,type) => { queue.push({msg,type}); next(); };
  return {
    info:    m => push(m,'info'),
    warn:    m => push(m,'warn'),
    success: m => push(m,'success')
  };
})();

const Sound = (() => {
  let ctx = null;
  let enabled = Storage.get(CONFIG.STORAGE_KEYS.SOUND, '1') === '1';
  const ensure = () => {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch { return null; }
  };
  const tone = (freq, type, dur, vol) => {
    if (!enabled) return;
    const ac = ensure(); if (!ac) return;
    const now = ac.currentTime;
    const osc = ac.createOscillator(); const g = ac.createGain();
    osc.frequency.value = freq; osc.type = type;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(now); osc.stop(now + dur);
  };
  return {
    isEnabled: () => enabled,
    toggle() { enabled = !enabled; Storage.set(CONFIG.STORAGE_KEYS.SOUND, enabled?'1':'0'); if(enabled) tone(880,'sine',.1,.1); return enabled; },
    pickup: () => tone(500, 'sine', .08, .05),
    snap:   () => tone(720, 'triangle', .12, .09),
    wrong:  () => tone(180, 'sawtooth', .15, .06),
    win()   {
      if (!enabled) return;
      const ac = ensure(); if (!ac) return;
      const now = ac.currentTime;
      [523, 659, 784, 1046].forEach((f,i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.frequency.value = f; o.type = 'sine';
        const t = now + i * .1;
        g.gain.setValueAtTime(.001, t);
        g.gain.exponentialRampToValueAtTime(.12, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + .35);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + .35);
      });
    }
  };
})();

/* ============================================================
   THREE.JS — SETUP
   ============================================================ */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1628, 14, 30);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 0.5, 0);

/* Iluminação */
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(5, 10, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.4);
fillLight.position.set(-6, 3, -5);
scene.add(fillLight);

/* Grid */
const grid = new THREE.GridHelper(24, 48, 0x334155, 0x1e293b);
grid.position.y = -0.5;
scene.add(grid);

/* ============================================================
   GAME STATE
   ============================================================ */
const state = {
  currentPlane: null,
  placedParts: new Set(),
  totalParts: 0,
  moves: 0,
  startTime: 0,
  timerInterval: null,
  meshes: new Map(),      // partId → mesh
  slots: new Map(),       // partId → ghost mesh
  draggable: [],          // lista de mesh arrastáveis
  completedPlanes: Storage.getJSON(CONFIG.STORAGE_KEYS.COMPLETED, []) || []
};

/* ============================================================
   BUILD GEOMETRY
   ============================================================ */
const buildGeometry = (geoDef) => {
  const [type, params] = geoDef;
  switch (type) {
    case 'box':      return new THREE.BoxGeometry(...params);
    case 'cylinder': return new THREE.CylinderGeometry(...params);
    case 'cone':     return new THREE.ConeGeometry(...params);
    case 'sphere':   return new THREE.SphereGeometry(...params);
    default:         return new THREE.BoxGeometry(1,1,1);
  }
};

/* ============================================================
   CARREGAR AVIÃO
   ============================================================ */
const clearScene = () => {
  for (const m of state.meshes.values()) scene.remove(m);
  for (const s of state.slots.values()) scene.remove(s);
  state.meshes.clear();
  state.slots.clear();
  state.draggable.length = 0;
  state.placedParts.clear();
};

const loadPlane = (planeId) => {
  const plane = AIRPLANES.find(p => p.id === planeId);
  if (!plane) return;

  clearScene();
  state.currentPlane = plane;
  state.placedParts.clear();
  state.moves = 0;
  state.startTime = Date.now();
  state.totalParts = plane.parts.length;

  /* Cria ghost slots (marcadores) */
  plane.parts.forEach(part => {
    const geo = buildGeometry(part.geo);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x7dd3fc, transparent: true, opacity: 0.12, wireframe: true
    });
    const ghost = new THREE.Mesh(geo, mat);
    ghost.position.set(...part.slot.pos);
    ghost.rotation.set(...part.slot.rot);
    scene.add(ghost);
    state.slots.set(part.id, ghost);
  });

  /* Cria peças arrastáveis */
  plane.parts.forEach((part, i) => {
    const geo = buildGeometry(part.geo);
    const mat = new THREE.MeshStandardMaterial({
      color: part.color, metalness: 0.35, roughness: 0.5
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.partId = part.id;

    /* Posição inicial espalhada em arco */
    const angle = (i / plane.parts.length) * Math.PI - Math.PI/2;
    const radius = 5.5;
    mesh.position.set(
      Math.cos(angle) * radius * 1.2,
      -0.3,
      Math.sin(angle) * radius * 0.6 + 4.5
    );
    mesh.rotation.set(
      Math.random()*0.4 - 0.2,
      Math.random()*Math.PI*2,
      Math.random()*0.4 - 0.2
    );
    mesh.userData.originPosition = mesh.position.clone();

    scene.add(mesh);
    state.meshes.set(part.id, mesh);
    state.draggable.push(mesh);
  });

  /* Ajusta câmera conforme dificuldade */
  const dist = 7 + plane.parts.length * 0.15;
  camera.position.set(dist * 0.7, dist * 0.55, dist);
  controls.target.set(0, 0.5, 0);

  updateHUD();
};

/* ============================================================
   DRAG & DROP 3D
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const dragOffset = new THREE.Vector3();
const intersectPoint = new THREE.Vector3();
let draggingObject = null;

const updatePointer = (e) => {
  const x = e.clientX;
  const y = e.clientY;
  pointer.x = (x / window.innerWidth) * 2 - 1;
  pointer.y = -(y / window.innerHeight) * 2 + 1;
};

const onPointerDown = (e) => {
  if (e.target !== renderer.domElement) return;
  if (document.getElementById('main-menu').offsetParent !== null) return;
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(state.draggable, false);
  if (!hits.length) return;

  draggingObject = hits[0].object;
  if (state.placedParts.has(draggingObject.userData.partId)) {
    draggingObject = null;
    return;
  }

  controls.enabled = false;
  Sound.pickup();

  dragPlane.setFromNormalAndCoplanarPoint(
    new THREE.Vector3(0,1,0), draggingObject.position
  );
  raycaster.ray.intersectPlane(dragPlane, intersectPoint);
  dragOffset.copy(draggingObject.position).sub(intersectPoint);

  /* Animação de escala */
  draggingObject.userData._scale = 1;
  const scaleUp = () => {
    if (!draggingObject) return;
    draggingObject.userData._scale = Math.min(1.15, draggingObject.userData._scale + 0.03);
    draggingObject.scale.setScalar(draggingObject.userData._scale);
    if (draggingObject.userData._scale < 1.15) requestAnimationFrame(scaleUp);
  };
  scaleUp();

  renderer.domElement.setPointerCapture?.(e.pointerId);
};

const onPointerMove = (e) => {
  if (!draggingObject) return;
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
    draggingObject.position.copy(intersectPoint.add(dragOffset));
  }
};

const onPointerUp = () => {
  if (!draggingObject) return;

  /* Restaura escala */
  draggingObject.userData._scale = 1.15;
  const scaleDown = () => {
    if (!draggingObject) return;
    draggingObject.userData._scale = Math.max(1, draggingObject.userData._scale - 0.03);
    draggingObject.scale.setScalar(draggingObject.userData._scale);
    if (draggingObject.userData._scale > 1) requestAnimationFrame(scaleDown);
    else draggingObject.scale.setScalar(1);
  };
  scaleDown();

  const partId = draggingObject.userData.partId;
  const slot = state.slots.get(partId);
  const plane = state.currentPlane;
  const part = plane.parts.find(p => p.id === partId);

  const dist = draggingObject.position.distanceTo(slot.position);

  if (dist < CONFIG.SNAP_DISTANCE) {
    snapToSlot(draggingObject, part, slot);
  } else {
    Sound.wrong();
    returnToOrigin(draggingObject);
  }

  draggingObject = null;
  controls.enabled = true;
};

const snapToSlot = (mesh, part, slot) => {
  const startPos = mesh.position.clone();
  const startRot = mesh.rotation.clone();
  const targetPos = slot.position.clone();
  const targetRot = new THREE.Euler(...part.slot.rot);

  const t0 = performance.now();
  const animate = () => {
    const t = Math.min((performance.now() - t0) / CONFIG.SNAP_ANIM_MS, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    mesh.position.lerpVectors(startPos, targetPos, ease);
    mesh.rotation.x = startRot.x + (targetRot.x - startRot.x) * ease;
    mesh.rotation.y = startRot.y + (targetRot.y - startRot.y) * ease;
    mesh.rotation.z = startRot.z + (targetRot.z - startRot.z) * ease;

    if (t < 1) requestAnimationFrame(animate);
    else onSnapped(mesh, slot);
  };
  animate();
};

const onSnapped = (mesh, slot) => {
  slot.visible = false;
  mesh.material.emissive = new THREE.Color(0x4ade80);
  mesh.material.emissiveIntensity = 0.35;
  setTimeout(() => { mesh.material.emissiveIntensity = 0; }, 600);

  state.placedParts.add(mesh.userData.partId);
  state.moves++;
  Sound.snap();
  updateHUD();

  if (state.placedParts.size === state.totalParts) {
    setTimeout(onWin, 500);
  }
};

const returnToOrigin = (mesh) => {
  const origin = mesh.userData.originPosition.clone();
  const startPos = mesh.position.clone();
  const t0 = performance.now();
  const animate = () => {
    const t = Math.min((performance.now() - t0) / CONFIG.RETURN_ANIM_MS, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    mesh.position.lerpVectors(startPos, origin, ease);
    if (t < 1) requestAnimationFrame(animate);
  };
  animate();
};

/* Eventos de ponteiro */
renderer.domElement.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

/* ============================================================
   HUD
   ============================================================ */
const $ = id => document.getElementById(id);
const statParts = $('stat-parts');
const statMoves = $('stat-moves');
const statTime  = $('stat-time');

const updateHUD = () => {
  statParts.textContent = `${state.placedParts.size}/${state.totalParts}`;
  statMoves.textContent = state.moves;
};

const startTimer = () => {
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - state.startTime) / 1000);
    statTime.textContent = `${secs}s`;
  }, 1000);
};

/* ============================================================
   WIN
   ============================================================ */
const onWin = () => {
  clearInterval(state.timerInterval);
  Sound.win();

  const planeId = state.currentPlane.id;
  if (!state.completedPlanes.includes(planeId)) {
    state.completedPlanes.push(planeId);
    Storage.setJSON(CONFIG.STORAGE_KEYS.COMPLETED, state.completedPlanes);
  }

  const secs = Math.floor((Date.now() - state.startTime) / 1000);
  $('win-moves').textContent = state.moves;
  $('win-time').textContent = `${secs}s`;
  $('win-modal').classList.add('active');

  /* Rotação comemorativa */
  const t0 = performance.now();
  const celebrate = () => {
    const t = (performance.now() - t0) / 1000;
    for (const m of state.meshes.values()) m.rotation.y += 0.025;
    if (t < 3) requestAnimationFrame(celebrate);
  };
  celebrate();
};

/* ============================================================
   MENU
   ============================================================ */
const renderMenu = () => {
  const grid = $('plane-grid');
  grid.replaceChildren();
  AIRPLANES.forEach(plane => {
    const completed = state.completedPlanes.includes(plane.id);
    /* Desbloqueio: primeira sempre livre, demais requerem anterior completo */
    const idx = AIRPLANES.indexOf(plane);
    const locked = idx > 0 && !state.completedPlanes.includes(AIRPLANES[idx-1].id);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'plane-card';
    if (completed) card.classList.add('completed');
    if (locked) card.classList.add('locked');
    card.disabled = locked;

    const emoji = document.createElement('span');
    emoji.className = 'plane-emoji';
    emoji.textContent = plane.emoji;

    const name = document.createElement('div');
    name.className = 'plane-name';
    name.textContent = plane.name;

    const parts = document.createElement('div');
    parts.className = 'plane-parts';
    parts.textContent = `${plane.parts.length} peças`;

    card.append(emoji, name, parts);
    if (!locked) card.addEventListener('click', () => startPlane(plane.id));
    grid.appendChild(card);
  });
};

const startPlane = (planeId) => {
  $('main-menu').classList.add('hidden');
  $('hud-top').style.display = '';
  $('hud-bottom').style.display = '';
  $('hint-tag').style.display = '';
  $('hud-title').textContent = AIRPLANES.find(p=>p.id===planeId).name.toUpperCase();
  loadPlane(planeId);
  startTimer();
  Toaster.info(`✈️ ${state.currentPlane.name}`);
};

const backToMenu = () => {
  clearInterval(state.timerInterval);
  clearScene();
  $('main-menu').classList.remove('hidden');
  $('hud-top').style.display = 'none';
  $('hud-bottom').style.display = 'none';
  $('hint-tag').style.display = 'none';
  $('win-modal').classList.remove('active');
  renderMenu();
};

/* ============================================================
   BOTÕES
   ============================================================ */
$('btn-back').addEventListener('click', backToMenu);
$('btn-restart').addEventListener('click', () => {
  if (!state.currentPlane) return;
  loadPlane(state.currentPlane.id);
  startTimer();
  Toaster.info('🔄 Reiniciado');
});
$('btn-reset-parts').addEventListener('click', () => {
  if (!state.currentPlane) return;
  /* Reorganiza apenas peças não colocadas */
  let i = 0;
  const plane = state.currentPlane;
  plane.parts.forEach(part => {
    if (state.placedParts.has(part.id)) return;
    const mesh = state.meshes.get(part.id);
    if (!mesh) return;
    const angle = (i / plane.parts.length) * Math.PI - Math.PI/2;
    const radius = 5.5;
    mesh.position.set(
      Math.cos(angle) * radius * 1.2,
      -0.3,
      Math.sin(angle) * radius * 0.6 + 4.5
    );
    mesh.rotation.set(0, Math.random()*Math.PI*2, 0);
    mesh.userData.originPosition = mesh.position.clone();
    i++;
  });
  Toaster.info('↶ Peças reorganizadas');
});
$('btn-hint').addEventListener('click', () => {
  const hint = $('hint-tag');
  hint.classList.add('warn');
  hint.textContent = '💡 Arraste cada peça até o contorno azul';
  setTimeout(() => {
    hint.classList.remove('warn');
    hint.textContent = '🖱️ Arraste as peças até o avião';
  }, 3000);
});
$('btn-next-plane').addEventListener('click', () => {
  const idx = AIRPLANES.indexOf(state.currentPlane);
  const next = AIRPLANES[idx + 1];
  if (next) {
    $('win-modal').classList.remove('active');
    startPlane(next.id);
  } else {
    Toaster.success('🏆 Parabéns! Montaste todos!');
    backToMenu();
  }
});
$('btn-sound').addEventListener('click', () => {
  const on = Sound.toggle();
  $('btn-sound').textContent = on ? '🔊' : '🔇';
  Toaster.info(on ? 'Som ativado' : 'Som desativado');
});

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   LOOP
   ============================================================ */
const clock = new THREE.Clock();
const animate = () => {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  /* Flutuação das peças não colocadas */
  for (const [id, mesh] of state.meshes) {
    if (state.placedParts.has(id) || mesh === draggingObject) continue;
    const baseY = mesh.userData.originPosition?.y ?? -0.3;
    mesh.position.y = baseY + Math.sin(time * 1.5 + mesh.position.x) * 0.05;
    mesh.rotation.y += 0.003;
  }

  /* Hélice gira se encaixada */
  const propeller = state.meshes.get('propeller');
  if (propeller && state.placedParts.has('propeller')) {
    propeller.rotation.x += 0.15;
  }

  controls.update();
  renderer.render(scene, camera);
};
animate();

/* ============================================================
   PWA — SERVICE WORKER + INSTALL
   ============================================================ */
const PWA = (() => {
  let deferredPrompt = null;
  const btnInstall = $('btn-install');

  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  const init = () => {
    if (isStandalone() && btnInstall) btnInstall.hidden = true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (btnInstall && !isStandalone()) btnInstall.hidden = false;
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      if (btnInstall) btnInstall.hidden = true;
      Toaster.success('✅ App instalado!');
    });

    btnInstall?.addEventListener('click', async () => {
      if (!deferredPrompt) {
        Toaster.info('Use o menu do navegador para instalar');
        return;
      }
      try {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') Toaster.success('🎉 Instalando...');
        deferredPrompt = null;
        btnInstall.hidden = true;
      } catch (err) { console.warn('[PWA]', err); }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('[SW]', err));
      });
    }
  };

  return { init };
})();

/* ============================================================
   BOOT
   ============================================================ */
$('btn-sound').textContent = Sound.isEnabled() ? '🔊' : '🔇';
renderMenu();
PWA.init();
setTimeout(() => $('loading').classList.add('hidden'), 300);
</script>
