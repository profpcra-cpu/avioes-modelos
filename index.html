<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Airplane Builder 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{
    height:100%; margin:0; overflow:hidden;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    color:#f0f9ff;
    background:radial-gradient(circle at 50% 30%,#1e3a5f 0%,#0a1628 55%,#050d18 100%);
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

  #canvas-container{position:fixed; inset:0; touch-action:none; z-index:1}
  #canvas-container canvas{display:block; outline:none}

  /* HUD TOP */
  .hud-top{
    position:fixed; top:0; left:0; right:0;
    display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:12px;
    padding:12px 16px; z-index:10;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
    pointer-events:none;
  }
  .hud-top > *{pointer-events:auto}
  .hud-actions{display:flex; gap:8px; align-items:center}
  .btn-icon{
    width:40px; height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(125,211,252,.2);
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s;
    color:#f0f9ff;
  }
  .btn-icon:hover{background:rgba(255,255,255,.15); transform:translateY(-2px)}
  .btn-icon.active{
    background:rgba(34,211,238,.2);
    border-color:rgba(34,211,238,.6);
    box-shadow:0 0 16px rgba(34,211,238,.4);
  }

  .hud-title{
    text-align:center;
    font-weight:800; font-size:14px;
    letter-spacing:1px; color:#7dd3fc;
    text-shadow:0 0 12px rgba(125,211,252,.5);
  }
  .hud-stats{
    display:flex; gap:14px; font-size:11px;
    justify-content:center;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .hud-stats span{opacity:.7; text-transform:uppercase; letter-spacing:.5px; font-weight:600}
  .hud-stats b{color:#7dd3fc; font-weight:800; font-size:13px}

  /* HUD BOTTOM */
  .hud-bottom{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:8px;
    padding:16px; z-index:10;
    background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
    pointer-events:none;
  }
  .hud-bottom > *{pointer-events:auto}
  .btn{
    padding:11px 18px;
    border-radius:999px;
    border:1px solid rgba(125,211,252,.3);
    background:linear-gradient(135deg,#0ea5e9,#3b82f6);
    color:#fff; font-size:13px; font-weight:700;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .2s;
    box-shadow:0 4px 14px rgba(14,165,233,.35);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.secondary{background:rgba(255,255,255,.1)}

  /* MENU */
  .main-menu{
    position:fixed; inset:0;
    z-index:50;
    display:flex; flex-direction:column;
    padding:24px 20px;
    background:radial-gradient(circle at 50% 30%,#1e3a5f 0%,#0a1628 55%,#050d18 100%);
    overflow-y:auto;
    transition:opacity .4s, transform .4s;
  }
  .main-menu.hidden{opacity:0; transform:translateY(-20px); pointer-events:none}
  .menu-header{text-align:center; margin-bottom:24px}
  .menu-header h1{
    font-size:30px; margin:0 0 6px;
    font-weight:800; letter-spacing:1px;
    background:linear-gradient(135deg,#7dd3fc,#0ea5e9);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .menu-header p{color:#94a3b8; font-size:13px; margin:0}
  .plane-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:14px;
    max-width:640px; margin:0 auto; width:100%;
  }
  .plane-card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(125,211,252,.2);
    border-radius:16px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    transition:all .25s;
    position:relative;
    overflow:hidden;
  }
  .plane-card:hover:not(.locked){
    background:rgba(255,255,255,.12);
    transform:translateY(-3px);
    border-color:#7dd3fc;
    box-shadow:0 0 24px rgba(125,211,252,.5);
  }
  .plane-card.locked{opacity:.45; cursor:not-allowed}
  .plane-card.locked::after{content:'🔒'; position:absolute; top:8px; right:8px; font-size:18px}
  .plane-card.completed::before{
    content:'✓';
    position:absolute; top:8px; left:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:#4ade80;
    color:#fff; font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .plane-emoji{font-size:46px; margin-bottom:6px; display:block}
  .plane-name{font-size:13px; font-weight:700; margin-bottom:4px}
  .plane-parts{font-size:10px; text-transform:uppercase; color:#94a3b8; letter-spacing:1px}

  /* WIN MODAL */
  .win-modal{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
    z-index:100;
    padding:20px;
  }
  .win-modal.active{display:flex}
  .win-card{
    background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
    border:1px solid rgba(125,211,252,.4);
    border-radius:24px;
    padding:28px 22px;
    text-align:center;
    max-width:380px; width:100%;
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(.8); opacity:0} to{transform:scale(1); opacity:1}}
  .win-emoji{font-size:52px; margin-bottom:8px}
  .win-card h2{font-size:22px; color:#7dd3fc; margin:0 0 8px; font-weight:800}
  .win-card p{opacity:.75; font-size:13px; margin:0 0 16px; color:#94a3b8}
  .win-stats{
    display:flex; justify-content:space-around;
    padding:14px; background:rgba(125,211,252,.08);
    border-radius:12px; margin-bottom:16px;
  }
  .win-stat-value{font-size:22px; font-weight:800; color:#7dd3fc}
  .win-stat-label{font-size:9px; text-transform:uppercase; color:#94a3b8; letter-spacing:1px}

  /* ============================================================
     CARD PEDAGÓGICO
     ============================================================ */
  .ped-overlay{
    position:fixed; inset:0;
    z-index:200;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(10px);
    padding:16px;
    animation:fadeIn .3s ease;
  }
  .ped-overlay.active{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .ped-card{
    background:linear-gradient(135deg,rgba(30,58,95,.98),rgba(10,22,40,.98));
    border:2px solid #7dd3fc;
    border-radius:24px;
    max-width:480px; width:100%;
    max-height:90vh;
    display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 60px rgba(125,211,252,.3);
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
  }

  .ped-header{
    padding:16px 20px 12px;
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid rgba(125,211,252,.2);
  }
  .ped-emoji{
    font-size:44px;
    filter:drop-shadow(0 0 12px rgba(125,211,252,.6));
  }
  .ped-names{flex:1; min-width:0}
  .ped-name-pt{
    font-family:'Fredoka',sans-serif;
    font-size:24px; font-weight:700;
    color:#fff; margin:0;
    line-height:1.1;
  }
  .ped-name-en{
    font-size:14px; color:#7dd3fc;
    font-weight:600;
    margin-top:2px;
  }
  .ped-name-en .pron{
    font-size:11px; color:#94a3b8;
    font-weight:400; margin-left:6px;
  }
  .ped-close{
    width:32px; height:32px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:#fff; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all .2s;
  }
  .ped-close:hover{background:rgba(255,255,255,.15); transform:rotate(90deg)}

  .ped-tabs{
    display:flex;
    padding:0 12px;
    gap:4px;
    background:rgba(0,0,0,.2);
  }
  .ped-tab{
    flex:1;
    padding:10px 6px 12px;
    background:none; border:none;
    color:#94a3b8;
    font-size:11px; font-weight:700;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:all .2s;
    display:flex; flex-direction:column;
    align-items:center; gap:2px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .ped-tab .tab-icon{font-size:18px}
  .ped-tab:hover{color:#f0f9ff}
  .ped-tab.active{color:#fff; border-bottom-color:currentColor}
  .ped-tab[data-tab="sci"].active{color:#22d3ee; border-bottom-color:#22d3ee}
  .ped-tab[data-tab="mat"].active{color:#fbbf24; border-bottom-color:#fbbf24}
  .ped-tab[data-tab="por"].active{color:#f472b6; border-bottom-color:#f472b6}
  .ped-tab[data-tab="eng"].active{color:#a78bfa; border-bottom-color:#a78bfa}

  .ped-body{
    padding:20px;
    overflow-y:auto;
    flex:1;
    -webkit-overflow-scrolling:touch;
  }
  .ped-body::-webkit-scrollbar{width:6px}
  .ped-body::-webkit-scrollbar-thumb{background:rgba(125,211,252,.3); border-radius:3px}

  .ped-pane{animation:fadeSlide .3s ease}
  @keyframes fadeSlide{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:translateY(0)}}

  .ped-pane-title{
    font-family:'Fredoka',sans-serif;
    font-size:17px; font-weight:600;
    margin:0 0 12px;
  }
  .ped-pane-title.sci{color:#22d3ee}
  .ped-pane-title.mat{color:#fbbf24}
  .ped-pane-title.por{color:#f472b6}
  .ped-pane-title.eng{color:#a78bfa}

  .ped-text{
    font-size:14px; line-height:1.6;
    color:#e2e8f0;
    margin:0 0 12px;
  }

  .ped-fact{
    padding:12px 14px;
    border-radius:0 12px 12px 0;
    font-size:13px; line-height:1.5;
    margin:12px 0 0;
    border-left:3px solid;
  }
  .ped-fact.sci{background:rgba(34,211,238,.1); border-left-color:#22d3ee}
  .ped-fact.mat{background:rgba(251,191,36,.1); border-left-color:#fbbf24}
  .ped-fact.por{background:rgba(244,114,182,.1); border-left-color:#f472b6}
  .ped-fact.eng{background:rgba(167,139,250,.1); border-left-color:#a78bfa}

  /* Sílabas */
  .syllables-row{
    display:flex; gap:6px; flex-wrap:wrap;
    justify-content:center;
    margin:14px 0;
  }
  .syllable{
    display:inline-block;
    padding:4px 10px;
    border-radius:8px;
    font-weight:800;
    font-family:'Fredoka',sans-serif;
    font-size:20px;
  }
  .syllable.vowel{background:rgba(244,114,182,.25); color:#fbcfe8}
  .syllable.cons{background:rgba(59,130,246,.25); color:#bfdbfe}

  /* Família */
  .ped-fam{
    display:flex; flex-wrap:wrap; gap:6px;
    margin:8px 0 12px;
  }
  .fam-tag{
    padding:4px 10px;
    background:rgba(244,114,182,.15);
    border-radius:999px;
    font-size:12px;
    color:#fbcfe8;
    font-weight:600;
  }

  /* Inglês */
  .eng-word{
    font-family:'Fredoka',sans-serif;
    font-size:32px; font-weight:700;
    color:#fff;
    text-align:center;
    margin:12px 0 6px;
  }
  .eng-pron{
    text-align:center;
    color:#a78bfa;
    font-size:14px;
    margin-bottom:14px;
  }
  .eng-example{
    font-style:italic;
    color:#ddd6fe;
    font-weight:600;
    font-size:15px;
  }
  .eng-translation{
    color:#94a3b8;
    font-size:12px;
    margin-top:6px;
  }

  .ped-actions{
    padding:12px 20px 16px;
    border-top:1px solid rgba(125,211,252,.2);
    display:flex; gap:8px;
  }
  .ped-btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    font-size:13px; font-weight:700;
    cursor:pointer;
    transition:all .2s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .ped-btn-listen{
    background:rgba(34,211,238,.15);
    border:1px solid rgba(34,211,238,.4);
    color:#22d3ee;
  }
  .ped-btn-listen:hover{background:rgba(34,211,238,.25)}
  .ped-btn-next{
    background:linear-gradient(135deg,#0ea5e9,#3b82f6);
    color:#fff;
    box-shadow:0 4px 14px rgba(14,165,233,.35);
  }
  .ped-btn-next:hover{transform:translateY(-2px)}

  /* LOADING */
  .loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#0a1628;
    z-index:300;
    font-size:14px; color:#7dd3fc;
    transition:opacity .4s;
  }
  .loading.hidden{opacity:0; pointer-events:none}

  /* Mobile */
  @media (max-width:480px){
    .ped-name-pt{font-size:20px}
    .ped-tab{font-size:9px; padding:8px 4px 10px}
    .ped-tab .tab-icon{font-size:16px}
    .ped-body{padding:16px}
    .eng-word{font-size:26px}
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- MENU -->
<div class="main-menu" id="main-menu">
  <div class="menu-header">
    <h1>✈️ AIRPLANE BUILDER</h1>
    <p>Escolha um avião para montar</p>
  </div>
  <div class="plane-grid" id="plane-grid"></div>
</div>

<!-- HUD TOP -->
<div class="hud-top" id="hud-top" style="display:none">
  <div class="hud-actions">
    <button class="btn-icon" id="btn-back" type="button" aria-label="Voltar">←</button>
    <button class="btn-icon" id="btn-voice" type="button" aria-label="Voz" title="Voz">🔊</button>
  </div>
  <div>
    <div class="hud-title" id="hud-title">AVIÃO</div>
    <div class="hud-stats">
      <span>Peças: <b id="stat-parts">0/0</b></span>
      <span>Movs: <b id="stat-moves">0</b></span>
      <span>Tempo: <b id="stat-time">0s</b></span>
    </div>
  </div>
  <div></div>
</div>

<!-- HUD BOTTOM -->
<div class="hud-bottom" id="hud-bottom" style="display:none">
  <button class="btn secondary" id="btn-reset" type="button">🔄 Reiniciar</button>
</div>

<!-- WIN MODAL -->
<div class="win-modal" id="win-modal">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2 id="win-title">Avião Montado!</h2>
    <p id="win-message">Parabéns!</p>
    <div class="win-stats">
      <div><div class="win-stat-value" id="win-moves">0</div><div class="win-stat-label">Movs</div></div>
      <div><div class="win-stat-value" id="win-time">0s</div><div class="win-stat-label">Tempo</div></div>
    </div>
    <button class="btn" id="btn-next" type="button" style="width:100%; justify-content:center">▶ Próximo Avião</button>
  </div>
</div>

<!-- CARD PEDAGÓGICO -->
<div class="ped-overlay" id="ped-overlay">
  <div class="ped-card">
    <div class="ped-header">
      <div class="ped-emoji" id="ped-emoji">✈️</div>
      <div class="ped-names">
        <h2 class="ped-name-pt" id="ped-name-pt">Peça</h2>
        <div class="ped-name-en">
          <span id="ped-en-word">Piece</span>
          <span class="pron" id="ped-en-pron">/piːs/</span>
        </div>
      </div>
      <button class="ped-close" id="ped-close" type="button" aria-label="Fechar">×</button>
    </div>

    <div class="ped-tabs">
      <button class="ped-tab active" data-tab="sci" type="button">
        <span class="tab-icon">🔬</span>
        <span>Ciências</span>
      </button>
      <button class="ped-tab" data-tab="mat" type="button">
        <span class="tab-icon">🔢</span>
        <span>Matemática</span>
      </button>
      <button class="ped-tab" data-tab="por" type="button">
        <span class="tab-icon">📖</span>
        <span>Português</span>
      </button>
      <button class="ped-tab" data-tab="eng" type="button">
        <span class="tab-icon">🌍</span>
        <span>Inglês</span>
      </button>
    </div>

    <div class="ped-body" id="ped-body"></div>

    <div class="ped-actions">
      <button class="ped-btn ped-btn-listen" id="ped-listen" type="button">
        🔊 Ouvir
      </button>
      <button class="ped-btn ped-btn-next" id="ped-next" type="button">
        ▶ Continuar
      </button>
    </div>
  </div>
</div>

<div class="loading" id="loading">Carregando...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./game.js"></script>
</body>
</html>
